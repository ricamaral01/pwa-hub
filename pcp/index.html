<!DOCTYPE html>
<html lang="pt-BR" class="auth-checking">
<head>
  <style>html.auth-checking body{visibility:hidden}</style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/auth/config.js"></script><script defer src="/auth/client.js"></script><script defer src="/auth/guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PCP" />
  <title>PCP</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      color-scheme: light;
      --bg-1: #e2e8f0;
      --bg-2: #f8fafc;
      --fg: #0f172a;
      --card: #ffffff;
      --accent: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--fg);
      background: radial-gradient(circle at 20% 20%, var(--bg-1), var(--bg-2));
    }

    .card {
      width: min(92vw, 460px);
      padding: 1.5rem;
      border-radius: 1rem;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.75rem;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 1rem;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 0.7rem 1rem;
      border-radius: 0.65rem;
      text-decoration: none;
      color: #ffffff;
      background: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body data-app-key="pcp">
  <main class="card">
    <h1>Abrindo PCP...</h1>
    <p>
      Se o redirecionamento não acontecer automaticamente, toque no botão abaixo.
    </p>
    <a href="https://pcp.concretrack.com.br/pages/login.html">Ir para PCP</a>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // Ignora falhas de registro sem bloquear o redirecionamento.
      });
    }

    window.location.replace("https://pcp.concretrack.com.br/pages/login.html");
  </script>
</body>
</html>
