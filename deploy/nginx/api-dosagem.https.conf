server {
    listen 80;
    server_name api-dosagem.concretrack.com.br;
    root /var/www/concretrack-dosagem-acme;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name api-dosagem.concretrack.com.br;
    ssl_certificate /etc/letsencrypt/live/api-dosagem.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dosagem.concretrack.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dosagem_tls:10m;
    location /api/ { proxy_pass http://127.0.0.1:__PORTA__; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; client_max_body_size 20m; }
    access_log /var/log/nginx/api-dosagem.access.log;
    error_log /var/log/nginx/api-dosagem.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
