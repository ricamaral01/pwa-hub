<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar na Dosagem · ConcreTrack</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="/auth/config.js"></script><script defer src="/auth/client.js"></script></head>
<body><main><h1>Conectando à Dosagem</h1><p id="message" role="status">Conferindo sua sessão do Hub…</p></main><script>
window.addEventListener('load',async()=>{
  const message=document.getElementById('message');
  const estado=new URLSearchParams(location.search).get('estado');
  history.replaceState(null,'','/auth/ponte-dosagem.html');
  if(!estado||!/^[A-Za-z0-9_-]{32,128}$/.test(estado)){message.textContent='Estado inválido. Reinicie o acesso pela Dosagem.';return;}
  try{
    const session=await window.ConcretrackAuth.session();
    if(!session?.access_token)throw Error('Entre no Hub antes de abrir a Dosagem.');
    const response=await fetch('https://dosagem.concretrack.com.br/api/v1/auth/hub/ticket',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({estado})});
    if(!response.ok)throw Error('Seu acesso à Dosagem não foi liberado.');
    const {ticket}=await response.json();
    location.replace('https://dosagem.concretrack.com.br/auth/retorno/?ticket='+encodeURIComponent(ticket)+'&estado='+encodeURIComponent(estado));
  }catch(error){message.textContent=error.message;}
});
</script></body></html>
