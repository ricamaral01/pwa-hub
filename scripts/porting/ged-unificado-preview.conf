# Incluir no server HTTPS de concrefer.concretrack.com.br, antes de /unificado/.
# Os blocos ^~ impedem que a regex global de assets do Unificado capture o Next.
location = /unificado/ged {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13070;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /unificado/ged/api/ {
    client_max_body_size 51m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://127.0.0.1:13071/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /unificado/ged/previews/ {
    access_log off;
    error_log /dev/null crit;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13071/previews/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /unificado/ged/uploads/ {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13071/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /unificado/ged/ {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13070;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
