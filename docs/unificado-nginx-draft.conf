# Trecho para o bloco HTTPS de /etc/nginx/sites-enabled/pcp-concrefer.
# Preparado a partir da configuração lida em 02/10/2026; ainda não aplicado.
# Publicar somente após homologar PCP, Mapa, login e ambiente isolado.

location = /unificado {
    return 301 /unificado/;
}

location ^~ /unificado/ {
    root /opt/pcp-concrefer;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
