<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Entrar — Concrefer</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="f2.css">
<style>
/* Login computador (>=1025px). Cores tiradas do logo oficial: azul #16416F, vermelho #A72141.
   O painel azul repete o desenho do logo: o poste à esquerda e os quatro cabos. */
:root{--cf-blue:#16416f;--cf-blue-dk:#0f3258;--cf-red:#a72141}
.lg{display:grid;grid-template-columns:minmax(0,1fr) 560px;width:100%;height:100%}
.brand{position:relative;overflow:hidden;background:var(--cf-blue);color:#d6e0ec;display:flex;flex-direction:column;justify-content:flex-end;padding:56px 64px 56px 168px}
.brand svg.mark{position:absolute;inset:0;width:100%;height:100%}
.brand .units{position:relative;display:flex;gap:28px;font-size:14px;font-weight:500;color:#fff}
.brand .units span{display:flex;align-items:center;gap:8px}
.brand .units span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cf-red);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.brand .app{position:relative;margin-top:14px;font-size:13px;color:#a9bcd3}
.side{background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px}
.form{width:380px;display:flex;flex-direction:column;gap:18px}
.form img{width:300px;height:auto;display:block;margin:0 0 18px -6px}
.form h1{margin:0;font-size:22px;font-weight:600;color:var(--c-ink)}
.form .inp{height:42px;border-color:#c9d2de}
.form .inp.focus{border-color:var(--cf-blue);box-shadow:0 0 0 3px rgba(22,65,111,.15)}
.form .btn{height:44px;justify-content:center;font-size:15px;background:var(--cf-blue);border-color:var(--cf-blue);color:#fff}
.form .show{margin-left:auto;font-size:13px;font-weight:500;color:var(--cf-blue)}
.foot{margin-top:28px;width:380px;display:flex;justify-content:space-between;font-size:12px;color:#8a94a4}
.foot b{font-weight:500;color:var(--cf-red)}
</style></head>
<body class="envpad"><div class="envbar">AMBIENTE DE TESTE · dados isolados de homologação</div>
<div class="lg">
  <div class="brand">
    <svg class="mark" viewBox="0 0 880 874" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
      <g fill="#ffffff" opacity=".10">
        <rect x="96" y="0" width="34" height="874"/>
        <rect x="64" y="160" width="816" height="7"/>
        <rect x="64" y="200" width="816" height="7"/>
        <rect x="64" y="240" width="816" height="7"/>
        <rect x="64" y="280" width="816" height="7"/>
      </g>
    </svg>
    <div class="units"><span>Campinas</span><span>Pederneiras</span><span>Ribeirão Preto</span><span>Noroeste</span></div>
    <div class="app">Unificado · planejamento, produção, laboratório e qualidade</div>
  </div>
  <div class="side">
    <div class="form">
      <img src="assets/logo-concrefer-oficial.png" alt="Concrefer">
      <h1>Entrar</h1>
      <div class="fld"><label>Usuário</label><div class="inp focus">ricardo.amaral</div></div>
      <div class="fld"><label>Senha</label><div class="inp">••••••••••<span class="show">Mostrar</span></div></div>
      <span class="btn pri">Entrar</span>
    </div>
    <div class="foot"><span>Sem acesso? Fale com o PCP da sua unidade.</span><span>v1.4.25</span></div>
  </div>
</div>
</body></html>
