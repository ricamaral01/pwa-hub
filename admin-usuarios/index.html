<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração de Usuários • Concretrack</title><link rel="stylesheet" href="../auth/ui.css"></head><body class="auth-page" data-app-key="admin-usuarios"><main class="auth-card auth-admin"><div class="auth-top"><div class="auth-brand" style="margin:0"><img src="../assets/img/logo-concretrack.png" alt=""><div><strong>ADMINISTRAÇÃO DE USUÁRIOS</strong><span>ACESSO EXCLUSIVO MASTER</span></div></div><div><a href="/">← Hub</a><button id="logout">Sair</button></div></div><div class="admin-grid"><section class="admin-panel"><h2 id="formTitle">Novo usuário</h2><form id="userForm"><input type="hidden" id="userId"><div class="auth-field"><label>Nome completo</label><input id="fullName" required minlength="3"></div><div class="auth-field"><label>Usuário</label><input id="username" required pattern="[A-Za-z0-9._-]{3,40}"></div><div class="auth-field"><label>E-mail</label><input id="userEmail" type="email" required></div><div class="auth-field" id="passwordField"><label>Senha provisória</label><div class="password-wrap"><input id="tempPassword" type="password" autocomplete="new-password"><button type="button" class="password-toggle">👁</button></div></div><div class="auth-field"><label>Nível de acesso</label><select id="accessLevel"><option value="operacional">Operacional</option><option value="gestao">Gestão</option><option value="gerencia">Gerência</option><option value="master">Master</option></select></div><div class="auth-field"><label><input id="isActive" type="checkbox" checked style="width:auto;min-height:0"> Usuário ativo</label></div><button class="auth-button">Salvar usuário</button><button class="auth-button" type="button" id="cancelEdit" style="background:#647985;display:none">Cancelar edição</button><div class="auth-message" id="message"></div></form></section><section class="admin-panel"><div class="auth-top"><h2>Usuários cadastrados</h2><button id="refresh">Atualizar</button></div><div class="admin-table-wrap"><table><thead><tr><th>Usuário</th><th>Nível</th><th>Status</th><th>Primeiro acesso</th><th>Ações</th></tr></thead><tbody id="usersBody"></tbody></table></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../auth/config.js"></script><script src="../auth/client.js"></script><script src="../auth/guard.js"></script><script src="../auth/admin-users.js"></script></body></html>
