<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha • Concretrack</title><link rel="stylesheet" href="./auth/ui.css"></head><body class="auth-page">
