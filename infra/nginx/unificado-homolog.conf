server {
    listen 18446 ssl;
    server_name concrefer.concretrack.com.br;
    root /opt/concrefer-unificado/homolog/public;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/concrefer.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concrefer.concretrack.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "connect-src 'self'" always;

    location = /unificado { return 302 /unificado/; }
    location = /unificado/sw.js {
        try_files $uri =404;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /unificado/laboratorio { return 302 /unificado/laboratorio/; }
    location = /unificado/laboratorio-auth {
        internal;
        proxy_pass http://127.0.0.1:13052/unified/laboratorio-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Unificado-Screen $http_x_unificado_screen;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /unificado/laboratorio/api/v1/ingest { return 404; }
    location ^~ /unificado/laboratorio/api/v1/device-config/ { return 404; }
    location ^~ /unificado/laboratorio/ {
        auth_request /unificado/laboratorio-auth;
        auth_request_set $lab_assertion $upstream_http_x_lab_assertion;
        proxy_pass http://127.0.0.1:13065/;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Assertion $lab_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "connect-src 'self'" always;
    }

    # Authentication is allowed; business writes in modules without a cloned
    # backend are denied by @production_read.
    location = /unificado/mapa/api/unified/login {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name concrefer.concretrack.com.br;
        proxy_set_header Host concrefer.concretrack.com.br;
    }
    location = /unificado/mapa/api/unified/laboratorio-bootstrap {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name concrefer.concretrack.com.br;
        proxy_set_header Host concrefer.concretrack.com.br;
    }
    location = /unificado/mapa/api/logout {
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name concrefer.concretrack.com.br;
        proxy_set_header Host concrefer.concretrack.com.br;
    }

    location /unificado/ { try_files $uri $uri/ @production_read; }
    location @production_read {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        proxy_pass https://127.0.0.1:443;
        proxy_ssl_server_name on;
        proxy_ssl_name concrefer.concretrack.com.br;
        proxy_set_header Host concrefer.concretrack.com.br;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        add_header Content-Security-Policy "connect-src 'self'" always;
    }
    location / { return 404; }
}
