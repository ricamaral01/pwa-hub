server {
    listen 80;
    server_name concrefer.concretrack.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name concrefer.concretrack.com.br;
    large_client_header_buffers 4 32k;

    ssl_certificate /etc/letsencrypt/live/concrefer.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concrefer.concretrack.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/concrefer-unificado/hub-api/public;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inserir no server HTTPS de concrefer.concretrack.com.br na VPS de testes.
    location = /unificado {
        return 301 /unificado/;
    }

    location = /unificado/testar {
        return 301 /unificado/testar/;
    }

    location = /unificado/testar/ {
        proxy_pass http://127.0.0.1:13052/testar/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/api/login {
        limit_req zone=mapa_unificado_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:13052/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/api/realtime/v1/websocket {
        proxy_pass http://127.0.0.1:13060/realtime/v1/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location ^~ /unificado/mapa/api/ {
        proxy_pass http://127.0.0.1:13052/;
        # O XLSX de montagem consulta até 300 IDs; Content-Location pode exceder 4 KiB.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/pcp/api/usuarios {
        proxy_pass http://127.0.0.1:13052/unified/pcp/usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/pcp/api/usuarios/ {
        proxy_pass http://127.0.0.1:13052/unified/pcp/usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/pcp/api/ {
        proxy_pass http://127.0.0.1:13054/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/ {
        root /opt/concrefer-unificado/public;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8015/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
