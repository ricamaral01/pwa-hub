server {
    listen 80;
    server_name concrefer.concretrack.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name concrefer.concretrack.com.br;
    large_client_header_buffers 4 32k;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    ssl_certificate /etc/letsencrypt/live/concrefer.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concrefer.concretrack.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/concrefer-unificado/hub-api/public;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Inserir no server HTTPS de concrefer.concretrack.com.br na VPS de testes.
    location = /unificado {
        return 301 /unificado/;
    }

    location = /unificado/testar {
        return 301 /unificado/testar/;
    }

    location = /unificado/pcp/ {
        return 302 /unificado/pcp/dashboard/;
    }

    location = /unificado/testar/ {
        proxy_pass http://127.0.0.1:13052/testar/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/testar/api/ {
        proxy_pass http://127.0.0.1:13052/testar/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/api/login {
        limit_req zone=mapa_unificado_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:13052/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/api/realtime/v1/websocket {
        proxy_pass http://127.0.0.1:13060/realtime/v1/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location ^~ /unificado/mapa/api/ {
        proxy_pass http://127.0.0.1:13052/;
        # O XLSX de montagem consulta até 300 IDs; Content-Location pode exceder 4 KiB.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/pcp/api/usuarios {
        proxy_pass http://127.0.0.1:13052/unified/pcp/usuarios;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/pcp/api/usuarios/ {
        proxy_pass http://127.0.0.1:13052/unified/pcp/usuarios/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /unificado/pcp/api/ {
        proxy_pass http://127.0.0.1:13054/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/operacao/unificado-bridge.css {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "private, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/mapa/operacao/unificado-bridge.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "private, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/pcp/unificado-shell.css {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "private, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/pcp/unificado-shell.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "private, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/sw.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/mapa/operacao/sw.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* ^/unificado/.*\.(?:js|css|png|svg|woff2|webp|ico)$ {
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        set $unificado_asset_cache "public, max-age=300, must-revalidate";
        if ($arg_v != "") {
            set $unificado_asset_cache "public, max-age=31536000, immutable";
        }
        add_header Cache-Control $unificado_asset_cache always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /unificado/ {
        root /opt/concrefer-unificado/public;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8015/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
