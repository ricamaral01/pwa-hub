    location = /unificado/qualidade {
        return 302 /unificado/qualidade/;
    }

    location = /unificado/qualidade-auth {
        internal;
        proxy_pass http://127.0.0.1:13052/unified/qualidade-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /unificado/qualidade/api/ {
        client_max_body_size 25M;
        auth_request /unificado/qualidade-auth;
        auth_request_set $qualidade_assertion $upstream_http_x_qualidade_assertion;
        proxy_pass http://127.0.0.1:13066/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Qualidade-Assertion $qualidade_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /unificado/qualidade/postes-api/ {
        auth_request /unificado/qualidade-auth;
        auth_request_set $qualidade_assertion $upstream_http_x_qualidade_assertion;
        proxy_pass http://127.0.0.1:13064/api/qualidade/postes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Qualidade-Assertion $qualidade_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /unificado/qualidade/ {
        client_max_body_size 25M;
        auth_request /unificado/qualidade-auth;
        root /opt/concrefer-unificado/public;
        try_files $uri $uri/ /unificado/qualidade/index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
