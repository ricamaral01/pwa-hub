# Prepared for A6 only. DO NOT install or reload before the approved cutover.
# Keep the existing TLS certificate and HTTP->HTTPS server from the old vhost.
# Replace only its HTTPS locations after a backup and nginx -t.
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}
location = /login {
    return 302 https://concrefer.concretrack.com.br/unificado/ged/login;
}
location ^~ /calibrations/verify/ {
    return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
}
location ^~ /documents/ {
    return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
}
location ^~ /uploads/ {
    return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
}
location ^~ /api/ {
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 410; }
    return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
}
location / {
    return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
}
