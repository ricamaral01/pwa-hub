server {
    server_name ged.concretrack.com.br;

    # HSTS - for?a browser a usar HTTPS sempre
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location = /login {
        return 302 https://concrefer.concretrack.com.br/unificado/ged/login;
    }
    location ^~ /calibrations/verify/ {
        return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
    }
    location ^~ /documents/ {
        return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
    }
    location ^~ /uploads/ {
        return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
    }
    location ^~ /api/ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 410; }
        return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
    }
    location / {
        return 302 https://concrefer.concretrack.com.br/unificado/ged$request_uri;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ged.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ged.concretrack.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name ged.concretrack.com.br;
    return 301 https://$host$request_uri;
}
