# Incluir no server HTTPS de concrefer.concretrack.com.br, antes de /unificado/.
# Os blocos ^~ impedem que a regex global de assets do Unificado capture o Next.
location = /unificado/ged {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13070;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /unificado/ged-auth {
    internal;
    proxy_pass http://127.0.0.1:13071/api/unified/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host 127.0.0.1:13071;
    proxy_set_header X-Forwarded-For "";
}

location = /unificado/ged/api/auth/unified-session {
    auth_request /unificado/ged-auth;
    auth_request_set $ged_assertion $upstream_http_x_ged_assertion;
    proxy_pass http://127.0.0.1:13071/api/unified/session;
    proxy_set_header Host 127.0.0.1:13071;
    proxy_set_header X-GED-Assertion $ged_assertion;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Cookie "";
    add_header Cache-Control "no-store" always;
}

location ^~ /unificado/ged/api/ {
    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://127.0.0.1:13071/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /unificado/ged/uploads/ {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13071/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /unificado/ged/ {
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:13070;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
