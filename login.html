<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Concretrack</title><link rel="stylesheet" href="./auth/ui.css"></head><body class="auth-page">
<main class="auth-card"><div class="auth-brand"><img src="./assets/img/logo-concretrack.png" alt=""><div><strong>CONCRETRACK</strong><span>USINA · ACESSO SEGURO</span></div></div><h1>Entrar</h1><p>Use seu e-mail ou nome de usuário para acessar o Hub.</p><form id="loginForm"><div class="auth-field"><label for="email">E-mail ou usuário</label><input id="email" name="email" type="text" autocomplete="username" required></div><div class="auth-field"><label for="password">Senha</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Exibir senha">👁</button></div></div><button class="auth-button" type="submit">Entrar</button><div class="auth-message" id="message" role="alert"></div></form><div class="auth-note">Após cinco tentativas inválidas, o acesso fica temporariamente bloqueado.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth/config.js"></script><script src="./auth/client.js"></script><script src="./auth/login.js"></script></body></html>
