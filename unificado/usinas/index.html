<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1730">
  <title>Usinas · Concrefer</title>
  <script>if (top === self) location.replace('/unificado/?view=usinas/');</script>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17304d;background:#f3f6f8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:clamp(20px,4vw,54px)}
    main{max-width:1160px;margin:auto}
    .eyebrow{margin:0 0 10px;color:#087f8c;font-size:.78rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:1.04;letter-spacing:-.05em}
    .intro{max-width:680px;margin:18px 0 32px;color:#5d7086;font-size:clamp(1rem,1.8vw,1.18rem);line-height:1.55}
    .panel{position:relative;overflow:hidden;min-height:250px;padding:clamp(24px,4vw,44px);border:1px solid #d9e7ea;border-radius:24px;background:#fff;box-shadow:0 18px 45px rgba(11,23,48,.06)}
    .panel::after{content:"";position:absolute;right:-70px;bottom:-145px;width:340px;height:340px;border:54px solid #d7f0f1;border-radius:50%;opacity:.65;pointer-events:none}
    .panel>*{position:relative;z-index:1}
    .tag{display:inline-block;padding:8px 12px;border-radius:999px;background:#e7f6f5;color:#076b76;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    h2{margin:20px 0 10px;font-size:clamp(1.35rem,2.8vw,2rem);letter-spacing:-.025em}
    .panel p{max-width:650px;margin:0;color:#5d7086;line-height:1.6}
    @media(max-width:600px){body{padding:16px}.panel{min-height:220px;border-radius:18px}.panel::after{right:-180px}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Módulo</p>
    <h1>Usinas</h1>
    <p class="intro">Área dedicada às operações das usinas dentro do Concrefer Unificado.</p>
    <section class="panel" aria-labelledby="visao-geral">
      <span class="tag">Visão geral</span>
      <h2 id="visao-geral">Usinas em um só lugar</h2>
      <p>As funções deste módulo serão apresentadas aqui conforme forem definidas e implantadas.</p>
    </section>
  </main>
</body>
</html>
