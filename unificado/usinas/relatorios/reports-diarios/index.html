    .report-list{border-top:1px solid #e5e7eb;margin-top:10px;padding-top:10px;}.report-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:12px;}.report-row:last-child{border-bottom:0;}.report-row a{font-weight:700;text-decoration:none;color:var(--ct-navy);}.muted{color:var(--ct-gray-lt);}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:8px;padding:22px;color:var(--ct-gray-lt);font-size:13px;}.app-footer{text-align:center;padding:20px;font-size:11px;color:var(--ct-silver);}.app-footer span{color:var(--ct-orange);font-weight:600;}

@media screen {
:root{--ct-orange:var(--c-orange);--ct-gray:var(--c-blue);--ct-gray-lt:var(--c-ink-2);--ct-blue:var(--c-ink-2);--ct-navy:var(--c-blue);--ct-silver:var(--c-line);--ct-bg:var(--c-bg);}
*{box-sizing:border-box;}
body{background:var(--ct-bg);margin:0;color:var(--ct-gray);}
.app-topbar{background:var(--ct-gray);color:var(--c-surface);}
.topbar-inner{display:flex;align-items:center;padding:12px 0;gap:12px;}
.topbar-logo{width:41px;height:41px;object-fit:contain;border-radius:var(--r);}
.topbar-title{font-size:18px;font-weight:700;}
.topbar-sub{font-size:10px;color:var(--ct-silver);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.btn-back,.btn-logout{border-radius:var(--r);height:36px;font-weight:600;font-size:12px;border:1px solid rgba(255,255,255,.18);color:var(--c-surface);background:rgba(255,255,255,.06);display:inline-flex;align-items:center;gap:6px;padding:0 14px;text-decoration:none;}
.btn-logout{background:rgba(224,122,58,.25);cursor:pointer;}

.page-header{padding:28px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;}
.page-header h2{font-size:22px;font-weight:800;margin:0;}

.status-pill{font-size:11px;font-weight:700;color:var(--c-blue);background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r);padding:4px 8px;display:inline-flex;align-items:center;gap:5px;}
.run-panel{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:14px 0;padding:12px;background:var(--c-bg);border:1px solid var(--c-line);border-radius:var(--r);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:800;color:var(--ct-gray-lt);}
.field input{height:36px;border-radius:var(--r);border:1px solid var(--c-line);padding:0 10px;font-size:13px;color:var(--ct-gray);background:var(--c-surface);}
.btn-ct{height:36px;border-radius:var(--r);border:1px solid rgba(15,23,42,.12);background:var(--c-surface);color:var(--ct-gray);font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:0 12px;cursor:pointer;}

.btn-ct:disabled{opacity:.65;cursor:wait;}

.report-row:last-child{border-bottom:0;}
.report-row a{font-weight:700;text-decoration:none;color:var(--ct-navy);}
.muted{color:var(--ct-gray-lt);}

@media (max-width:720px){.page-header{display:block;}
.updated{margin-top:8px;}
.topbar-right{gap:6px;}
.btn-back,.btn-logout{padding:0 10px;}

.field,.field input,.btn-ct{width:100%;}
.report-row{align-items:flex-start;flex-direction:column;gap:4px;}

<script>
    // Acesso direto volta à casca autenticada; no iframe preserva o layout original.
    if (top === self) {
      const params = new URLSearchParams({area:'relatorios'});
      if ('reports') params.set('app', 'reports');
      for (const [name, value] of new URLSearchParams(location.search)) params.set(name, value);
      location.replace('/unificado/?view=' + encodeURIComponent('usinas/?' + params));
    } else {
      const syncShell = () => {
        if (parent !== top || top.location.pathname !== '/unificado/') return;
        const params = new URLSearchParams({area:'relatorios'});
        if ('reports') params.set('app', 'reports');
        for (const [name, value] of new URLSearchParams(location.search)) params.set(name, value);
        const view = 'usinas/?' + params;
        top.history.replaceState({view}, '', '/unificado/?view=' + encodeURIComponent(view));
      };
      addEventListener('DOMContentLoaded', syncShell);
      const originalReplace = history.replaceState.bind(history);
      history.replaceState = (...args) => { originalReplace(...args); syncShell(); };
    }
    function concretrackLogout() {
      if (top.UnificadoAuth?.logout) top.UnificadoAuth.logout();
      else top.location.assign('/unificado/login.html');
    }
    </script>

<link rel="stylesheet" href="/unificado/shell/tokens.css?v=1.4.13"><link rel="stylesheet" href="/unificado/shell/module-components.css?v=1.4.13"><link rel="stylesheet" href="/unificado/shell/usinas-visual.css?v=1.4.13"><script defer src="/unificado/shell/components.js?v=1.4.13"></script></head>
<body>
  <div class="app-topbar"><div class="container"><div class="topbar-inner"><img src="/unificado/usinas/relatorios/assets/PRINCIPAL@2x.png" alt="Logo" class="topbar-logo"><div><div class="topbar-title"><i class="bi bi-calendar2-check me-2"></i>Reports Diários</div><div class="topbar-sub">ConcreTrack &bull; DAutomação</div></div><div class="topbar-right"><a class="btn-back" href="/unificado/usinas/relatorios/"><i class="bi bi-arrow-left"></i> Voltar</a><button class="btn-logout" onclick="concretrackLogout()"><i class="bi bi-box-arrow-right me-1"></i>Sair</button></div></div></div><div class="topbar-accent"></div></div>
  <main class="container">
    <div class="page-header"><div><h2>Reports <span>Diários</span></h2><p>Central dos agentes automatizados. A execução é manual e usa D-1 como data padrão.</p></div><div id="updated" class="updated">Carregando...</div></div>
    <div id="agents" class="row g-3 mb-4"></div>
    <div id="empty" class="empty d-none"><i class="bi bi-info-circle me-2"></i>Nenhum report diário foi publicado ainda.</div>
  </main>
  <div class="app-footer">&copy; 2026 <span>ConcreTrack</span> - DAutomação</div>
  <script>
    const fmtDate = (value) => {
      if (!value) return '-';
      const parts = String(value).split('-');
      return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : value;
    };
    const fmtTime = (value) => value ? new Date(value).toLocaleString('pt-BR') : '-';
    const yesterday = () => {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    };
    async function runPcpReport(){
      const input = document.getElementById('pcp-date');
      const button = document.getElementById('pcp-run');
      const msg = document.getElementById('pcp-message');
      const date = input.value || yesterday();
      button.disabled = true;
      msg.textContent = `Gerando relatório de ${fmtDate(date)}...`;
      try{
        const res = await fetch(`/unificado/mapa/api/usina/reporting/relatorios/reports-diarios/pcp-producao/run?data=${encodeURIComponent(date)}`, {
          method:'POST',
          credentials:'same-origin',
          cache:'no-store'
        });
        const data = await res.json().catch(() => ({}));
        if(!res.ok) throw new Error(data.detail || 'Falha ao executar o agente.');
        msg.textContent = `Relatório de ${fmtDate(data.date)} gerado com sucesso.`;
        await loadReports(false);
        window.open(data.url, '_blank', 'noopener');
      }catch(err){
        msg.textContent = err.message || 'Falha ao executar o agente.';
      }finally{
        button.disabled = false;
      }
    }
    async function loadReports(showLoading = true){
      const container = document.getElementById('agents');
      const empty = document.getElementById('empty');
      const updated = document.getElementById('updated');
      try{
        const res = await fetch('/unificado/mapa/api/usina/reporting/pcp-producao/manifest-full?ts=' + Date.now(), {cache:'no-store'});
        if(!res.ok) throw new Error('manifest');
        const data = await res.json();
        updated.textContent = 'Lista atualizada em ' + fmtTime(data.generated_at);
        container.innerHTML = '';
        const agents = data.agents || [];
        empty.classList.toggle('d-none', agents.length > 0);
        agents.forEach(agent => {
          const reports = agent.reports || [];
          const list = reports.slice(0, 8).map(report => `<div class="report-row"><div><a href="${report.url}" target="_blank" rel="noopener">${fmtDate(report.date)}</a><div class="muted">Gerado em ${fmtTime(report.updated_at)}</div></div><a class="btn-ct" href="${report.url}" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i>Abrir arquivo</a></div>`).join('');
          container.insertAdjacentHTML('beforeend', `<div class="col-12 col-lg-6"><section class="agent-card"><div class="agent-head"><div class="icon-box"><i class="bi bi-robot"></i></div><div><h5>${agent.name}</h5><p>${agent.description}</p></div></div><span class="status-pill"><i class="bi bi-hand-index-thumb"></i>Execução manual</span><div class="run-panel"><div class="field"><label for="pcp-date">Data de referência</label><input id="pcp-date" type="date" value="${yesterday()}" disabled title="Informe a data no ERP de origem"></div><button id="pcp-run" class="btn-ct btn-primary-ct" type="button" onclick="window.open('https://dautomacao.com/concretrack/relatorios/reports-diarios/','_blank','noopener')" title="Gerar no ERP de origem"><i class="bi bi-play-fill"></i>Gerar no ERP de origem</button><button class="btn-ct" type="button" onclick="loadReports()"><i class="bi bi-arrow-clockwise"></i>Atualizar lista</button><div id="pcp-message" class="message w-100">Abra o ERP de origem e informe a data antes de gerar.</div></div><div class="report-list">${list || '<div class="muted">Sem arquivos publicados.</div>'}</div></section></div>`);
        });
      }catch(err){
        updated.textContent = 'Falha ao carregar a lista';
        empty.classList.remove('d-none');
      }
    }
    loadReports();
  </script>
  <script src="/unificado/vendor/bootstrap/bootstrap.bundle.min.js"></script>
