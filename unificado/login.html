<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Entrar — Concrefer</title>
  <link rel="stylesheet" href="shell/shell.css?v=0.1.0">
  <script defer src="shell/auth.js?v=0.1.0"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand"><span class="brand-icon">C</span><span><strong>Concrefer</strong><small>Planejamento e produção</small></span></div>
      <h1 id="login-title">Bem-vindo de volta</h1>
      <p>Entre com seu usuário e senha para acessar o sistema.</p>
      <form>
        <label class="login-field"><span>Usuário</span><input type="text" name="username" autocomplete="username" disabled></label>
        <label class="login-field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" disabled></label>
        <button class="button button-primary login-submit" type="button" disabled>Entrar</button>
      </form>
      <small class="login-note">Estrutura local da Fase 1. O login será ativado depois da validação do ambiente de teste e da integração das sessões.</small>
    </section>
  </main>
</body>
</html>
