<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B1730">
  <link rel="manifest" href="manifest.webmanifest?v=1.4.26">
  <link rel="icon" href="data:,">
  <title>Entrar — Concrefer</title>
  <link rel="stylesheet" href="shell/shell.css?v=1.4.26">
  <link rel="stylesheet" href="shell/password-visibility.css?v=1.4.26">
  <link rel="stylesheet" href="shell/login-original.css?v=1.4.26" media="(max-width:1024px)">
  <script defer src="shell/auth.js?v=1.4.26"></script>
  <script defer src="shell/password-visibility.js?v=1.4.26"></script>
<link rel="stylesheet" href="/unificado/shell/tokens.css?v=1.4.26" media="(min-width:1025px)">
<link rel="stylesheet" href="shell/login-desktop.css?v=1.4.26" media="(min-width:1025px)">
<style>.login-desktop-story,.login-desktop-heading,.login-official-logo,.login-desktop-foot{display:none}</style>
</head>
<body>
  <aside class="login-desktop-story" aria-label="Unificado Concrefer">
    <svg class="login-story-mark" viewBox="0 0 880 874" preserveAspectRatio="xMinYMin slice" aria-hidden="true"><g fill="#fff" opacity=".10"><rect x="96" y="0" width="34" height="874"/><rect x="64" y="160" width="816" height="7"/><rect x="64" y="200" width="816" height="7"/><rect x="64" y="240" width="816" height="7"/><rect x="64" y="280" width="816" height="7"/></g></svg>
    <div class="login-story-units"><span>Campinas</span><span>Pederneiras</span><span>Ribeirão Preto</span><span>Noroeste</span></div>
    <div class="login-story-app">Unificado · planejamento, produção, laboratório e qualidade</div>
  </aside>
  <main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand" aria-label="Concrefer e ConcreTrack">
        <img class="login-logo-concrefer" src="assets/img/logo-concrefer.png" alt="Concrefer" width="190" height="50">
        <span class="login-brand-divider" aria-hidden="true"></span>
        <img class="login-logo-concretrack" src="assets/img/logo-concretrack.png" alt="ConcreTrack" width="76" height="76">
      </div>
      <img class="login-official-logo" src="assets/img/logo-concrefer-oficial.png" alt="Concrefer" width="300" height="81">
      <h1 id="login-title"><span class="login-current-heading">Bem-vindo de volta</span><span class="login-desktop-heading">Entrar</span></h1>
      <p>Entre com seu usuário e senha para acessar o sistema.</p>
      <form id="unificado-login-form">
        <label class="login-field"><span>Usuário</span><input type="text" name="username" autocomplete="username" required></label>
        <label class="login-field"><span>Senha</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button button-primary login-submit" type="submit">Entrar</button>
      </form>
      <form id="first-access-form" hidden>
        <label class="login-field"><span>Nova senha</span><input type="password" name="newPassword" autocomplete="new-password" minlength="6" required></label>
        <label class="login-field"><span>Confirmar nova senha</span><input type="password" name="confirmPassword" autocomplete="new-password" minlength="6" required></label>
        <button class="button button-primary login-submit" type="submit">Definir senha e entrar</button>
      </form>
      <p id="login-feedback" role="status" aria-live="polite"></p>
      <small class="login-note">Planejamento e Produção em um só acesso.</small>
      <div class="login-desktop-foot"><span>Sem acesso? Fale com o PCP da sua unidade.</span><span id="login-desktop-version"></span></div>
    </section>
  </main>
  <small id="unificado-version" style="position:fixed;right:10px;bottom:8px;color:#acb8ca;font:11px monospace"></small>
  <script>fetch('/unificado/VERSION',{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{
    document.getElementById('unificado-version').textContent='v'+v.trim();
    document.getElementById('login-desktop-version').textContent='v'+v.trim();
  }).catch(()=>{});</script>
</body>
</html>
