    location = /unificado/screen-authorize {
        internal;
        proxy_pass http://127.0.0.1:13052/unified/screen-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Unificado-Screen $http_x_unificado_screen;
    }

    location = /unificado/pcp/api/login {
        proxy_pass http://127.0.0.1:13054/api/login;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/pcp/primeiro-acesso/ {
        root /opt/concrefer-unificado/public;
        try_files $uri/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/pcp/primeiro-acesso/index.html {
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/unificado/pcp/[^/]+/index\.html$ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/unificado/pcp/[^/]+/$ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/pcp/api/usuarios/trocar-senha-primeiro-acesso {
        proxy_pass http://127.0.0.1:13052/unified/pcp/usuarios/trocar-senha-primeiro-acesso;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # Unit authorization and the PCP bearer token are enforced on every
    # production route by the FastAPI router itself. This more specific
    # prefix keeps the generic PCP screen gate from rejecting these APIs.
    location ^~ /unificado/pcp/api/producao/ {
        proxy_pass http://127.0.0.1:13054/api/producao/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/unificado/producao/pederneiras/(?:app/|mao-de-obra/app/)?index\.html$ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/unificado/producao/pederneiras/(?:app/|mao-de-obra/app/)?$ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/producao/pederneiras/app/manifest.webmanifest {
        root /opt/concrefer-unificado/public;
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/producao/pederneiras/mao-de-obra/app/manifest.webmanifest {
        root /opt/concrefer-unificado/public;
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/producao/pederneiras/app/sw.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/producao/pederneiras/mao-de-obra/app/sw.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/operacao/ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files /unificado/mapa/operacao/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/mapa/operacao/index.html {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/usinas/ {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files /unificado/usinas/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/usinas/index.html {
        auth_request /unificado/screen-authorize;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/m/inspecao/ {
        auth_request /unificado/screen-authorize;
        error_page 401 =302 /unificado/m/inspecao/login.html?next=m%2Finspecao%2F;
        error_page 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files /unificado/m/inspecao/index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/m/inspecao/index.html {
        auth_request /unificado/screen-authorize;
        error_page 401 =302 /unificado/m/inspecao/login.html?next=m%2Finspecao%2F;
        error_page 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/public;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/m/inspecao/manifest.webmanifest {
        root /opt/concrefer-unificado/public;
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/m/inspecao/sw.js {
        root /opt/concrefer-unificado/public;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @unificado_screen_denied {
        default_type text/html;
        charset utf-8;
        return 403 '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Sem acesso</title><body><main style="font:600 18px system-ui;padding:32px">Você não tem acesso a esta tela</main></body></html>';
    }

    location @unificado_api_denied {
        default_type application/json;
        charset utf-8;
        return 403 '{"error":"Você não tem acesso a esta tela"}';
    }
