<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#243b6e"/>
      <stop offset="100%" style="stop-color:#1a2d52"/>
    </linearGradient>
  </defs>
  <!-- Background rounded -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="13" y1="30" x2="87" y2="30" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <line x1="13" y1="48" x2="87" y2="48" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <line x1="13" y1="66" x2="87" y2="66" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
  <!-- Bar 1: lime green — tallest -->
  <rect x="13" y="26" width="16" height="58" rx="4" fill="#7ed93a"/>
  <!-- Bar 2: sky blue -->
  <rect x="33" y="36" width="16" height="48" rx="4" fill="#4aaeff"/>
  <!-- Bar 3: crimson/red -->
  <rect x="53" y="50" width="16" height="34" rx="4" fill="#f03060"/>
  <!-- Bar 4: hot pink -->
  <rect x="71" y="54" width="16" height="30" rx="4" fill="#ff6eb0"/>
  <!-- Base line -->
  <line x1="11" y1="84.5" x2="89" y2="84.5" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
</svg>
