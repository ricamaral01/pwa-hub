    location = /unificado/laboratorio {
        return 302 /unificado/laboratorio/;
    }

    # O próprio serviço valida a credencial restrita a um único certificado.
    location ^~ /certificados/postes/ {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:13064/certificados/postes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/laboratorio-auth {
        internal;
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:13052/unified/laboratorio-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Unificado-Screen $http_x_unificado_screen;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /unificado/laboratorio/api/v1/ingest { return 404; }
    location ^~ /unificado/laboratorio/api/v1/device-config/ { return 404; }

    # API do leitor: uma sessão expirada precisa retornar 401. O PWA conserva
    # a leitura na fila e jamais deve interpretar o HTML do login como ACK.
    location ^~ /unificado/laboratorio/cec-api/ {
        client_max_body_size 8k;
        error_page 401 = @laboratorio_cec_unauthorized;
        error_page 403 = @laboratorio_cec_forbidden;
        auth_request /unificado/laboratorio-auth;
        auth_request_set $lab_assertion $upstream_http_x_lab_assertion;
        proxy_pass http://127.0.0.1:13064/cec-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Assertion $lab_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location @laboratorio_cec_unauthorized {
        default_type application/json;
        return 401 '{"detail":"Sessão expirada."}';
    }

    location @laboratorio_cec_forbidden {
        default_type application/json;
        return 403 '{"detail":"Sem acesso ao Controle Estatístico."}';
    }

    location ^~ /unificado/laboratorio/ {
        client_max_body_size 11m;
        error_page 401 = @laboratorio_login;
        error_page 403 = @laboratorio_sem_acesso;
        auth_request /unificado/laboratorio-auth;
        auth_request_set $lab_assertion $upstream_http_x_lab_assertion;
        proxy_pass http://127.0.0.1:13064/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Assertion $lab_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @laboratorio_login {
        return 302 /unificado/login.html?next=laboratorio/;
    }

    location @laboratorio_sem_acesso {
        default_type text/plain;
        charset utf-8;
        return 403 "Você não tem acesso a esta tela";
    }
