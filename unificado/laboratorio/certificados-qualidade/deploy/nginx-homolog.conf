    location ^~ /unificado/laboratorio/certificados-qualidade/ {
        client_max_body_size 8m;
        error_page 401 = @laboratorio_login;
        error_page 403 = @laboratorio_sem_acesso;
        auth_request /unificado/laboratorio-auth;
        auth_request_set $lab_assertion $upstream_http_x_lab_assertion;
        proxy_pass http://127.0.0.1:13075/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Assertion $lab_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /v/ {
        proxy_pass http://127.0.0.1:13075/v/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        add_header Cache-Control "no-store" always;
    }
