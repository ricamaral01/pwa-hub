<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Fechamento Diario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/unificado/shell/auth.js?v=1.0.17-fechamento"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root { --navy:#12385a; --blue:#1f6fb2; --orange:#e8762a; --bg:#eef3f7; --line:#d2deea; --muted:#64748b; --text:#172033; --red:#d72626; }
    * { box-sizing:border-box; font-family:"Montserrat","Segoe UI",system-ui,sans-serif; letter-spacing:0; }
    body { margin:0; background:var(--bg); color:var(--text); }
    .topbar { background:#303841; color:#fff; border-bottom:3px solid var(--orange); }
    .topbar-inner { min-height:66px; display:flex; align-items:center; gap:12px; }
    .topbar img { width:42px; height:42px; object-fit:contain; }
    .top-title { font-size:17px; font-weight:800; }
    .top-sub { font-size:11px; color:#cbd5e1; }
    .top-actions { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn-top, .btn-action { border-radius:8px; height:38px; padding:0 12px; display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:800; text-decoration:none; border:1px solid transparent; cursor:pointer; }
    .btn-top { color:#fff; background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.18); }
    .btn-top:hover { color:#fff; background:rgba(255,255,255,.14); }
    .btn-action:disabled { opacity:.65; cursor:wait; }
    .share-notice { position:fixed; right:16px; bottom:16px; z-index:9999; max-width:min(420px,calc(100vw - 32px)); padding:12px 16px; border-radius:8px; background:#12385a; color:#fff; box-shadow:0 8px 24px rgba(0,0,0,.25); font-size:13px; font-weight:700; }
    .share-notice a { color:#fff; text-decoration:underline; margin-left:8px; }
    main { padding:24px 0 40px; }
    .toolbar { display:flex; justify-content:space-between; align-items:end; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .toolbar h1 { margin:0; font-size:23px; font-weight:800; color:#243244; }
    .toolbar p { margin:3px 0 0; font-size:13px; color:var(--muted); }
    .controls { display:flex; align-items:end; gap:8px; flex-wrap:wrap; }
    .date-field label { display:block; margin:0 0 4px; font-size:10px; color:#506278; font-weight:800; text-transform:uppercase; }
    .date-field input { height:38px; border:1px solid #c5d2e0; border-radius:8px; padding:0 10px; color:#1e2d43; font-weight:700; background:#fff; }
    .btn-primary-ct { background:var(--navy); color:#fff; }
    .btn-whatsapp { background:#168247; color:#fff; }
    .btn-telegram { background:#2182cc; color:#fff; }
    .btn-light-ct { background:#fff; color:#26364a; border-color:#c5d2e0; }
    .workspace { display:grid; grid-template-columns:minmax(0, 1fr) 340px; gap:18px; align-items:start; }
    .sheet { background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 26px rgba(18,40,68,.08); overflow:hidden; }
    .report-header { padding:20px 22px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; }
    .brand { display:flex; align-items:center; gap:14px; min-width:190px; }
    .logo-concrefer { width:178px; max-width:38vw; height:auto; max-height:54px; object-fit:contain; }
    .report-title { text-align:center; }
    .report-title h2 { margin:0; font-size:24px; font-weight:800; color:var(--navy); }
    .report-title p { margin:4px 0 0; font-size:12px; font-weight:700; color:var(--muted); }
    .date-badge { text-align:right; border-left:1px solid var(--line); padding-left:16px; min-width:150px; }
    .date-badge span { display:block; font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:800; }
    .date-badge strong { display:block; font-size:20px; color:var(--orange); font-weight:800; }
    .content { padding:18px 22px 22px; }
    .kpis { display:grid; grid-template-columns:repeat(6,minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
    .kpi { border:1px solid var(--line); border-radius:8px; padding:12px; background:#f8fbfd; min-height:118px; min-width:0; display:flex; flex-direction:column; align-items:stretch; text-align:left; }
    .kpi span { display:block; min-height:32px; font-size:10px; line-height:1.3; color:var(--muted); font-weight:800; text-transform:uppercase; }
    .kpi small { display:block; margin-top:4px; font-size:10px; line-height:1.3; color:#6b7a90; }
    .kpi strong { display:block; margin-top:auto; padding-top:9px; font-size:23px; line-height:1.15; font-variant-numeric:tabular-nums; color:#172033; font-weight:800; }
    .section { margin-top:16px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; border-bottom:2px solid var(--navy); padding-bottom:7px; margin-bottom:8px; }
    .section-head h3 { margin:0; font-size:15px; font-weight:800; color:var(--navy); text-transform:uppercase; }
    .section-head span { font-size:11px; color:var(--muted); font-weight:700; }
    table.report-table { width:100%; border-collapse:collapse; font-size:13px; }
    .report-table th { background:var(--navy); color:#fff; font-size:11px; text-transform:uppercase; padding:9px 10px; border:1px solid #0b2945; }
    .report-table td { padding:8px 10px; border:1px solid var(--line); background:#fff; vertical-align:middle; }
    .report-table tbody tr:nth-child(even) td { background:#f8fbfd; }
    .report-table tfoot th { background:#eaf2f9; color:#172033; border:1px solid var(--line); padding:9px 10px; }
    .num { text-align:right; font-variant-numeric:tabular-nums; font-weight:800; }
    .type { font-weight:800; color:#1e2d43; }
    .m3 { color:var(--red); }
    .occ-list { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .occ-total { padding:6px 10px; background:#eaf2f9; color:#12385a; border-bottom:1px solid var(--line); font-size:12px; font-weight:800; }
    .occ-item { padding:10px 12px; background:#fff; border-bottom:1px solid var(--line); font-size:13px; font-weight:700; display:grid; grid-template-columns:150px 1fr; gap:10px; }
    .occ-item:last-child { border-bottom:0; }
    .occ-time { color:#506278; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
    .occ-empty { padding:14px; text-align:center; color:#0f5132; background:#eef9f2; font-weight:800; }
    .aside { display:grid; gap:12px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; box-shadow:0 10px 26px rgba(18,40,68,.06); }
    .panel h3 { margin:0 0 10px; font-size:14px; font-weight:800; color:#243244; }
    .source { border:1px solid #dde6f0; border-radius:8px; padding:9px; background:#f8fbfd; margin-bottom:8px; }
    .source b { display:block; font-size:12px; color:#1e2d43; }
    .source span { display:block; font-size:11px; color:var(--muted); word-break:break-word; }
    .warn { display:none; background:#fff7ed; border:1px solid #fed7aa; color:#7c2d12; border-radius:8px; padding:10px 12px; font-size:12px; font-weight:700; }
    .share-box { width:100%; resize:vertical; min-height:260px; border:1px solid #c5d2e0; border-radius:8px; padding:10px; font-size:12px; color:#26364a; }
    .loading { padding:44px; text-align:center; color:#53657a; font-weight:800; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 9px; font-size:11px; font-weight:800; background:#eaf3ff; color:#1f5f9e; }
    .pdf-document { position:fixed; left:-10000px; top:0; width:198mm; background:#fff; z-index:-1; }
    .pdf-document #report { display:block !important; color:#172033; background:#fff; }
    .pdf-document .report-header { padding:10px 12px; gap:12px; grid-template-columns:150px 1fr 112px; }
    .pdf-document .logo-concrefer { width:142px; max-height:38px; }
    .pdf-document .report-title h2 { font-size:21px; }
    .pdf-document .report-title p { font-size:12px; margin-top:2px; }
    .pdf-document .date-badge { min-width:108px; padding-left:10px; }
    .pdf-document .date-badge span { font-size:9px; }
    .pdf-document .date-badge strong { font-size:21px; }
    .pdf-document .content { padding:9px 12px 12px; display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; }
    .pdf-document .content > .d-flex, .pdf-document .kpis, .pdf-document .section-summary { grid-column:1 / -1; }
    .pdf-document .content > .d-flex { margin-bottom:0 !important; }
    .pdf-document .status-pill, .pdf-document .text-muted.small { font-size:10px; padding:3px 8px; }
    .pdf-document .kpis { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-bottom:0; }
    .pdf-document .kpi { min-height:78px; padding:8px 9px; border-radius:6px; }
    .pdf-document .kpi span { min-height:20px; font-size:8px; line-height:1.1; }
    .pdf-document .kpi strong { padding-top:5px; font-size:21px; line-height:1.05; }
    .pdf-document .kpi small { font-size:8px; margin-top:3px; }
    .pdf-document .section { margin-top:0; break-inside:avoid; page-break-inside:avoid; }
    .pdf-document .section-postes { display:none !important; }
    .pdf-document .section-head { padding-bottom:3px; margin-bottom:4px; border-bottom-width:1px; }
    .pdf-document .section-head h3 { font-size:12px; }
    .pdf-document .section-head span { font-size:9px; }
    .pdf-document table.report-table { font-size:10px; line-height:1.15; }
    .pdf-document .report-table th { font-size:8px; padding:4px 5px; }
    .pdf-document .report-table td, .pdf-document .report-table tfoot th { padding:3px 5px; }
    .pdf-document .section-postes table.report-table, .pdf-document .section-armacoes table.report-table { font-size:9px; }
    .pdf-document .section-postes .report-table td,
    .pdf-document .section-postes .report-table th,
    .pdf-document .section-postes .report-table tfoot th,
    .pdf-document .section-armacoes .report-table td,
    .pdf-document .section-armacoes .report-table th,
    .pdf-document .section-armacoes .report-table tfoot th { padding:2px 4px; }
    .pdf-document .occ-item { grid-template-columns:88px 1fr; gap:5px; padding:4px 5px; font-size:9px; }
    .pdf-document .occ-total { padding:4px 5px; font-size:9px; }
    .pdf-document .occ-time { font-size:8px; }
    .pdf-document .occ-empty { padding:7px; font-size:9px; }
    @media (max-width:1100px) { .workspace { grid-template-columns:1fr; } .kpis { grid-template-columns:repeat(2,minmax(120px,1fr)); } }
    @media (max-width:760px) {
      .topbar-inner, .report-header { grid-template-columns:1fr; display:grid; }
      .top-actions { margin-left:0; justify-content:flex-start; }
      .report-title { text-align:left; }
      .date-badge { text-align:left; border-left:0; border-top:1px solid var(--line); padding:12px 0 0; }
      .content { padding:14px; }
      .kpis { grid-template-columns:1fr; }
      .report-table { min-width:520px; }
      .table-scroll { overflow:auto; }
      .occ-item { grid-template-columns:1fr; }
    }
    @media print {
      @page { size:A4 portrait; margin:6mm; }
      body { background:#fff; }
      .topbar, .toolbar, .aside, .share-notice { display:none !important; }
      main, main.container { padding:0; margin:0; width:100%; max-width:none; }
      .workspace { display:block; }
      .sheet { box-shadow:none; border:0; border-radius:0; overflow:visible; }
      #report { min-height:285mm; }
      .report-header { padding:9px 0; gap:12px; grid-template-columns:148px 1fr 108px; }
      .logo-concrefer { width:140px; max-height:38px; }
      .report-title h2 { font-size:21px; }
      .report-title p { font-size:12px; margin-top:2px; }
      .date-badge { min-width:108px; padding-left:10px; }
      .date-badge span { font-size:9px; }
      .date-badge strong { font-size:21px; }
      .content { padding:8px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:7px 10px; }
      .content > .d-flex, .kpis, .section-summary { grid-column:1 / -1; }
      .content > .d-flex { margin-bottom:0 !important; }
      .status-pill, .text-muted.small { font-size:10px; padding:3px 8px; }
      .kpis { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-bottom:0; }
      .kpi { min-height:78px; padding:8px 9px; border-radius:6px; }
      .kpi span { min-height:20px; font-size:8px; line-height:1.1; }
      .kpi strong { padding-top:5px; font-size:21px; line-height:1.05; }
      .kpi small { font-size:8px; margin-top:3px; }
      .section { margin-top:0; break-inside:avoid; page-break-inside:avoid; }
      .section-postes { display:none !important; }
      .section-head { padding-bottom:3px; margin-bottom:4px; border-bottom-width:1px; }
      .section-head h3 { font-size:12px; }
      .section-head span { font-size:9px; }
      table.report-table { font-size:10px; line-height:1.15; }
      .report-table th { font-size:8px; padding:4px 5px; }
      .report-table td, .report-table tfoot th { padding:3px 5px; }
      .section-postes table.report-table, .section-armacoes table.report-table { font-size:9px; }
      .section-postes .report-table td,
      .section-postes .report-table th,
      .section-postes .report-table tfoot th,
      .section-armacoes .report-table td,
      .section-armacoes .report-table th,
      .section-armacoes .report-table tfoot th { padding:2px 4px; }
      .occ-item { grid-template-columns:88px 1fr; gap:5px; padding:4px 5px; font-size:9px; }
      .occ-total { padding:4px 5px; font-size:9px; }
      .occ-time { font-size:8px; }
      .occ-empty { padding:7px; font-size:9px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container">
      <div class="topbar-inner">
        <div>
          <div class="top-title">Fechamento Diario</div>
          <div class="top-sub">Unidade Campinas</div>
        </div>
        <div class="top-actions">
          <a class="btn-top" href="/unificado/"><i class="bi bi-arrow-left"></i> Voltar</a>
          <button class="btn-top" type="button" onclick="window.top.UnificadoAuth?.logout()"><i class="bi bi-box-arrow-right"></i> Sair</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="toolbar">
      <div>
        <h1>Fechamento Diario</h1>
        <p>Consolidado executivo de producao, produtividade, ocorrencias e armacoes.</p>
      </div>
      <div class="controls">
        <div class="date-field">
          <label for="dataRel">Data base</label>
          <input id="dataRel" type="date">
        </div>
        <button id="btnGerar" class="btn-action btn-primary-ct" type="button"><i class="bi bi-arrow-clockwise"></i> Atualizar</button>
        <button id="btnPdf" class="btn-action btn-light-ct" type="button"><i class="bi bi-filetype-pdf"></i> PDF</button>
        <button id="btnWhatsapp" class="btn-action btn-whatsapp" type="button"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button id="btnTelegram" class="btn-action btn-telegram" type="button"><i class="bi bi-telegram"></i> Telegram</button>
        <button class="btn-action btn-light-ct" type="button" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
      </div>
    </div>

    <div class="workspace">
      <section class="sheet">
        <div id="loading" class="loading">Carregando fechamento...</div>
        <div id="report" class="d-none"></div>
      </section>

      <aside class="aside">
        <div id="warnMapa" class="warn"></div>
        <div id="warnFuncionarios" class="warn"></div>
        <div id="warnArmacao" class="warn"></div>
        <div class="panel">
          <h3>Fontes</h3>
          <div id="fontes"></div>
        </div>
        <div class="panel">
          <h3>Texto para envio</h3>
          <textarea id="shareText" class="share-box" readonly></textarea>
        </div>
      </aside>
    </div>
  </main>

  <script>
    let currentReport = null;
    let pdfCache = null;
    let pendingPdf = null;
    let pdfCacheVersion = 0;
    let shareNoticeTimer = null;

    function invalidatePdfCache() {
      pdfCacheVersion += 1;
      pdfCache = null;
      pendingPdf = null;
    }

    function showShareNotice(message, linkUrl = "") {
      let notice = document.getElementById("shareNotice");
      if (!notice) {
        notice = document.createElement("div");
        notice.id = "shareNotice";
        notice.className = "share-notice";
        notice.setAttribute("role", "status");
        document.body.appendChild(notice);
      }
      notice.textContent = message;
      if (linkUrl) {
        const link = document.createElement("a");
        link.href = linkUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Abrir conversa";
        notice.appendChild(link);
      }
      notice.hidden = false;
      clearTimeout(shareNoticeTimer);
      shareNoticeTimer = setTimeout(() => { notice.hidden = true; }, 9000);
    }

    async function copyShareText(text) {
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
      } catch (_) {
        // Clipboard access is optional; the share text is still passed to the app.
      }
    }

    const APP_VERSION = "20261016-share-pdf-8";

    function todayYmd() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[ch]);
    }

    function fmtNum(value, casas = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
      return Number(value).toLocaleString("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas });
    }

    function fmtInt(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "-";
      return Number(value).toLocaleString("pt-BR", { maximumFractionDigits: 0 });
    }

    function fmtVolumePostes(item) {
      return fmtNum(item?.m3);
    }

    function fmtDate(ymd) {
      if (!ymd) return "-";
      const [y, m, d] = ymd.split("-");
      return `${d}/${m}/${String(y).slice(-2)}`;
    }

    function fmtDateTime(value, fallbackDate, fallbackTime) {
      let text = value ? String(value).replace("T", " ").slice(0, 16) : "";
      if (!text && fallbackDate) text = `${fallbackDate} ${String(fallbackTime || "00:00").slice(0, 5)}`;
      if (!text) return "-";
      const [datePart, timePart = ""] = text.split(" ");
      const datePieces = datePart.split("-");
      const formattedDate = datePieces.length === 3 ? `${datePieces[2]}/${datePieces[1]}/${String(datePieces[0]).slice(-2)}` : datePart;
      return `${formattedDate} ${timePart.slice(0, 5)}`.trim();
    }

    function reportFuncionarios(data) {
      const c = data?.controle_estatistico || {};
      const fonte = data?.fontes?.funcionarios || {};
      const value = c.quantidade_funcionarios ?? fonte.quantidade;
      if (value !== null && value !== undefined && !Number.isNaN(Number(value))) return Number(value);
      return null;
    }

    function statusLabel(src) {
      if (!src) return "sem informacao";
      const parts = [src.status || "ok"];
      if (src.auth) parts.push(`auth ${src.auth}`);
      if (src.erro) parts.push(src.erro);
      if (src.coluna) parts.push(`coluna ${src.coluna}`);
      if (src.linha_datas) parts.push(`datas linha ${src.linha_datas}`);
      if (src.linha_homens) parts.push(`homens linha ${src.linha_homens}`);
      if (src.fallback_publico) parts.push(`csv publico: ${src.fallback_publico}`);
      if (src.fallback) parts.push(`fallback: ${src.fallback.fonte} / ${src.fallback.status}`);
      return parts.join(" | ");
    }

    function renderSources(fontes) {
      const labels = {
        postes: "Postes produzidos",
        setores: "Resumo por setor",
        volume: "Volume de concreto",
        funcionarios: "Mão de obra direta (setores 1+2, 3 e 4)",
        ocorrencias: "Ocorrencias",
        armacoes: "Producao de armacoes"
      };
      document.getElementById("fontes").innerHTML = Object.keys(labels).map(key => {
        const src = fontes[key] || {};
        return `<div class="source"><b>${labels[key]}</b><span>${escapeHtml(src.fonte || "-")}<br>${escapeHtml(statusLabel(src))}</span></div>`;
      }).join("");
    }

    function renderReport(data) {
      const c = data.controle_estatistico || {};
      const postes = data.postes || [];
      const setores = data.resumo_setores || [];
      const ocorrencias = data.ocorrencias || [];
      const qtdOcorrencias = Number(c.quantidade_ocorrencias ?? ocorrencias.length ?? 0);
      const armacoes = data.estoque_armacoes?.itens || [];
      const funcionarios = reportFuncionarios(data);
      const maoSetores = data.fontes?.funcionarios?.setores || [];
      const indiceM3Funcionario = data.fontes?.funcionarios?.status === "ok" ? c.indice_m3_por_funcionario : null;
      const postesFuncionario = data.fontes?.funcionarios?.status === "ok" ? c.postes_por_funcionario : null;
      const atualizado = data.atualizado_em ? new Date(data.atualizado_em).toLocaleString("pt-BR") : "-";
      const report = document.getElementById("report");

      report.innerHTML = `
        <div class="report-header">
          <div class="brand">
            <img class="logo-concrefer" src="/unificado/assets/img/logo-concrefer.png?v=20261021" alt="Concrefer">
          </div>
          <div class="report-title"><h2>Fechamento Diario</h2><p>Unidade Campinas</p></div>
          <div class="date-badge"><span>Data de producao</span><strong>${fmtDate(data.data)}</strong></div>
        </div>
        <div class="content">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <span class="status-pill"><i class="bi bi-building"></i> Unidade: ${escapeHtml(data.unidade || "Campinas")}</span>
            <span class="text-muted small fw-bold">Atualizado em ${atualizado}</span>
          </div>
          <div class="kpis">
            <div class="kpi"><span>Total de postes</span><small>Mapa Unificado</small><strong>${fmtInt(c.total_postes_produzidos)}</strong></div>
            <div class="kpi"><span>Concreto registrado</span><small>Usina até ${escapeHtml(String(data.fontes?.volume?.ultima || "-").slice(0, 5))}</small><strong>${fmtNum(c.total_m3_concreto_produzido)}</strong></div>
            <div class="kpi"><span>Funcionários MOD</span><small>Setores 1+2, 3 e 4</small><strong>${fmtInt(funcionarios)}</strong></div>
            <div class="kpi"><span>m³ por funcionário</span><small>Volume da usina / MOD</small><strong>${fmtNum(indiceM3Funcionario)}</strong></div>
            <div class="kpi"><span>Postes por funcionário</span><small>Produção / MOD</small><strong>${fmtNum(postesFuncionario)}</strong></div>
            <div class="kpi"><span>Ocorrências</span><small>Registros do dia</small><strong>${fmtInt(qtdOcorrencias)}</strong></div>
          </div>
          <div class="section section-summary">
            <div class="section-head"><h3>Resumo por setor</h3><span>postes e volume estimado</span></div>
            <div class="table-scroll"><table class="report-table">
              <thead><tr><th>Setor</th><th class="text-end">Postes</th><th class="text-end">m³ estimado</th></tr></thead>
              <tbody>${setores.length ? setores.map(s => `<tr><td class="type">${escapeHtml(s.setor)}</td><td class="num">${fmtInt(s.postes)}</td><td class="num m3">${fmtVolumePostes(s)}</td></tr>`).join("") : `<tr><td colspan="3" class="text-center fw-bold">Sem registros por setor no Mapa Unificado nesta data</td></tr>`}</tbody>
              <tfoot><tr><th>Total</th><th class="num">${fmtInt(setores.reduce((sum, s) => sum + Number(s.postes || 0), 0))}</th><th class="num m3">${fmtVolumePostes({m3:c.m3_estimado_postes,m3_identificado:c.m3_postes_identificados,postes_sem_peso:c.postes_sem_peso})}</th></tr></tfoot>
            </table></div>
          </div>
          <div class="section section-labor">
            <div class="section-head"><h3>Mão de obra direta por grupo</h3><span>PCP Unificado - MOD</span></div>
            <div class="table-scroll"><table class="report-table">
              <thead><tr><th>Grupo</th><th class="text-end">Trabalhadores</th></tr></thead>
              <tbody>${maoSetores.some(s => Number(s.lancamentos) > 0) ? maoSetores.map(s => `<tr><td class="type">${escapeHtml(s.setor)}</td><td class="num">${Number(s.lancamentos) > 0 ? fmtInt(s.quantidade) : "-"}</td></tr>`).join("") : `<tr><td colspan="2" class="text-center fw-bold">Sem lancamentos de mao de obra direta nesta data</td></tr>`}</tbody>
              <tfoot><tr><th>Total MOD (S1+S2, S3 e S4)</th><th class="num">${fmtInt(funcionarios)}</th></tr></tfoot>
            </table></div>
          </div>
          <div class="section section-stats">
            <div class="section-head"><h3>Controle estatistico</h3><span>produtividade diaria</span></div>
            <div class="table-scroll"><table class="report-table">
              <tbody>
                <tr><td class="type">Mão de obra direta (S1+S2, S3 e S4)</td><td class="num">${fmtInt(funcionarios)}</td></tr>
                <tr><td class="type">Indice m3 por trabalhador direto</td><td class="num">${fmtNum(indiceM3Funcionario)}</td></tr>
                <tr><td class="type">Total postes produzidos</td><td class="num">${fmtInt(c.total_postes_produzidos)}</td></tr>
                <tr><td class="type">Postes por funcionario</td><td class="num">${fmtNum(postesFuncionario)}</td></tr>
                <tr><td class="type">Concreto produzido na usina (m³)</td><td class="num m3">${fmtNum(c.total_m3_concreto_produzido)}</td></tr>
                <tr><td class="type">Volume estimado dos postes (m³)</td><td class="num m3">${fmtVolumePostes({m3:c.m3_estimado_postes,m3_identificado:c.m3_postes_identificados,postes_sem_peso:c.postes_sem_peso})}</td></tr>
                <tr><td class="type">Quantidade de ocorrencias</td><td class="num">${fmtInt(qtdOcorrencias)}</td></tr>
              </tbody>
            </table></div>
          </div>
          <div class="section section-ocorrencias">
            <div class="section-head"><h3>Ocorrencias operacionais</h3><span>${fmtInt(qtdOcorrencias)} registro(s)</span></div>
            <div class="occ-list"><div class="occ-total">Total de ocorrencias: ${fmtInt(qtdOcorrencias)}</div>${ocorrencias.length ? ocorrencias.map(o => `<div class="occ-item"><span class="occ-time">${escapeHtml(fmtDateTime(o.registrado_em, data.data, o.hora))}</span><span>${escapeHtml(o.descricao)}</span></div>`).join("") : `<div class="occ-empty">Sem ocorrencias registradas no dia.</div>`}</div>
          </div>
          <div class="section section-postes">
            <div class="section-head"><h3>Produção de postes</h3><span>volume estimado por tipo</span></div>
            <div class="table-scroll"><table class="report-table">
              <thead><tr><th>Tipo / forma</th><th class="text-end">Qtd</th><th class="text-end">m³ estimado</th></tr></thead>
              <tbody>${postes.length ? postes.map(p => `<tr><td class="type">${escapeHtml(p.tipo)}</td><td class="num">${fmtInt(p.qtd)}</td><td class="num m3">${fmtVolumePostes(p)}</td></tr>`).join("") : `<tr><td colspan="3" class="text-center fw-bold">Sem postes registrados no Mapa Unificado nesta data</td></tr>`}</tbody>
              <tfoot><tr><th>Total</th><th class="num">${fmtInt(c.total_postes_produzidos)}</th><th class="num m3">${fmtVolumePostes({m3:c.m3_estimado_postes,m3_identificado:c.m3_postes_identificados,postes_sem_peso:c.postes_sem_peso})}</th></tr></tfoot>
            </table></div>
          </div>
          <div class="section section-armacoes">
            <div class="section-head"><h3>Producao de armacoes</h3><span>Total ${fmtInt(data.estoque_armacoes?.total ?? null)}</span></div>
            <div class="table-scroll"><table class="report-table">
              <thead><tr><th>Tipo</th><th class="text-end">Quantidade</th></tr></thead>
              <tbody>${armacoes.length ? armacoes.map(a => `<tr><td class="type">${escapeHtml(a.tipo)}</td><td class="num">${fmtInt(a.quantidade)}</td></tr>`).join("") : `<tr><td colspan="2" class="text-center fw-bold">Dados de armacoes nao disponiveis para esta data</td></tr>`}</tbody>
              <tfoot><tr><th>Total</th><th class="num">${fmtInt(data.estoque_armacoes?.total ?? null)}</th></tr></tfoot>
            </table></div>
          </div>
        </div>
      `;
      report.classList.remove("d-none");
    }

    function buildShareText(data) {
      const c = data.controle_estatistico || {};
      const ocorrencias = data.ocorrencias || [];
      const qtdOcorrencias = Number(c.quantidade_ocorrencias ?? ocorrencias.length ?? 0);
      const funcionarios = reportFuncionarios(data);
      const indiceM3Funcionario = data.fontes?.funcionarios?.status === "ok" ? c.indice_m3_por_funcionario : null;
      const postesFuncionario = data.fontes?.funcionarios?.status === "ok" ? c.postes_por_funcionario : null;
      const linhas = [];
      linhas.push(`FECHAMENTO DIARIO - UNIDADE ${data.unidade || "Campinas"}`);
      linhas.push(`Data: ${fmtDate(data.data)}`);
      linhas.push("");
      linhas.push("RESUMO");
      linhas.push(`Postes produzidos: ${fmtInt(c.total_postes_produzidos)}`);
      linhas.push(`Concreto registrado na usina: ${fmtNum(c.total_m3_concreto_produzido)} m3`);
      linhas.push(`Volume estimado dos postes: ${fmtNum(c.m3_estimado_postes)} m3`);
      linhas.push(`Mao de obra direta (S1 a S4): ${fmtInt(funcionarios)}`);
      linhas.push(`Indice m3/trabalhador direto: ${fmtNum(indiceM3Funcionario)}`);
      linhas.push(`Postes/trabalhador direto: ${fmtNum(postesFuncionario)}`);
      linhas.push(`Ocorrencias: ${fmtInt(qtdOcorrencias)}`);
      linhas.push("");
      linhas.push("RESUMO POR SETOR");
      const setores = data.resumo_setores || [];
      if (setores.length) setores.forEach(s => linhas.push(`${s.setor}: ${fmtInt(s.postes)} postes | ${fmtVolumePostes(s)} m3 estimados`));
      else linhas.push("Sem dados por setor.");
      linhas.push("");
      linhas.push("MAO DE OBRA DIRETA POR SETOR");
      const maoSetores = data.fontes?.funcionarios?.setores || [];
      if (maoSetores.some(s => Number(s.lancamentos) > 0)) maoSetores.forEach(s => linhas.push(`${s.setor}: ${Number(s.lancamentos) > 0 ? fmtInt(s.quantidade) : "sem lancamento"}`));
      else linhas.push("Sem lancamentos de mao de obra direta.");
      linhas.push("");
      linhas.push("PRODUCAO DE POSTES");
      (data.postes || []).forEach(p => linhas.push(`${p.tipo}: ${fmtInt(p.qtd)} un | ${fmtVolumePostes(p)} m3 estimados`));
      linhas.push("");
      linhas.push("OCORRENCIAS");
      linhas.push(ocorrencias.length ? ocorrencias.map(o => `- ${fmtDateTime(o.registrado_em, data.data, o.hora)} - ${o.descricao}`).join("\n") : "Sem ocorrencias registradas.");
      linhas.push("");
      linhas.push("PRODUCAO DE ARMACOES");
      const armacoes = data.estoque_armacoes?.itens || [];
      if (armacoes.length) armacoes.forEach(a => linhas.push(`${a.tipo}: ${fmtInt(a.quantidade)}`));
      else linhas.push("Sem dados.");
      linhas.push(`Total armacoes: ${fmtInt(data.estoque_armacoes?.total ?? null)}`);
      return linhas.join("\n");
    }

    async function loadReport() {
      invalidatePdfCache();
      const data = document.getElementById("dataRel").value || todayYmd();
      const loading = document.getElementById("loading");
      const report = document.getElementById("report");
      const warnMapa = document.getElementById("warnMapa");
      const warnFuncionarios = document.getElementById("warnFuncionarios");
      const warnArmacao = document.getElementById("warnArmacao");
      loading.classList.remove("d-none");
      loading.textContent = "Carregando fechamento...";
      report.classList.add("d-none");
      warnMapa.style.display = "none";
      warnFuncionarios.style.display = "none";
      warnArmacao.style.display = "none";
      currentReport = null;
      try {
        const res = await fetch(`/unificado/relatorios/api/fechamento-diario?data=${encodeURIComponent(data)}&v=${APP_VERSION}-${Date.now()}`, {
          cache: "no-store",
          headers: { "Cache-Control": "no-cache" }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        currentReport = await res.json();
        renderReport(currentReport);
        renderSources(currentReport.fontes || {});
        document.getElementById("shareText").value = buildShareText(currentReport);
        const mapaSrc = currentReport.fontes?.postes || {};
        if (mapaSrc.status !== "ok") {
          warnMapa.textContent = `Postes do Mapa Unificado nao disponiveis para esta data. Detalhe: ${statusLabel(mapaSrc)}.`;
          warnMapa.style.display = "block";
        }
        const funcSrc = currentReport.fontes?.funcionarios || {};
        if (funcSrc.status !== "ok") {
          warnFuncionarios.textContent = `Mão de obra direta dos grupos 1+2, 3 e 4 incompleta ou sem lancamento no PCP Unificado para esta data. Os indices de produtividade por trabalhador ficam indisponiveis. Detalhe: ${statusLabel(funcSrc)}.`;
          warnFuncionarios.style.display = "block";
        }
        const armSrc = currentReport.fontes?.armacoes || {};
        if (armSrc.fonte && armSrc.fonte.startsWith("google_sheets") && armSrc.status !== "ok") {
          warnArmacao.textContent = `Aba Armacoes da planilha nao retornou dados para esta data. Foi usado fallback quando disponivel. Detalhe: ${statusLabel(armSrc)}.`;
          warnArmacao.style.display = "block";
        }
        // Warm the PDF cache without delaying the visible report.
        getCachedPdfBlob().catch(err => console.warn("PDF nao pre-gerado", err));
      } catch (err) {
        loading.textContent = `Erro ao carregar fechamento: ${err.message}`;
        return;
      } finally {
        if (currentReport) loading.classList.add("d-none");
      }
    }

    function pdfFileName() {
      const data = currentReport?.data || document.getElementById("dataRel").value || todayYmd();
      return `fechamento-diario-campinas-${data}.pdf`;
    }

    function buildPdfElement() {
      const wrapper = document.createElement("div");
      wrapper.className = "pdf-document";
      const clone = document.getElementById("report").cloneNode(true);
      clone.classList.remove("d-none");
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      return wrapper;
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }

    async function createPdfBlob() {
      if (!currentReport) await loadReport();
      if (!currentReport) throw new Error("Relatorio nao carregado.");
      if (typeof html2canvas === "undefined" || !window.jspdf?.jsPDF) throw new Error("Gerador de PDF indisponivel.");
      const wrapper = buildPdfElement();
      try {
        const canvas = await html2canvas(wrapper, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff",
          scrollX: 0,
          scrollY: 0,
          windowWidth: wrapper.scrollWidth,
          windowHeight: wrapper.scrollHeight
        });
        const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait" });
        const pageW = 210;
        const pageH = 297;
        const margin = 5;
        const maxW = pageW - margin * 2;
        const maxH = pageH - margin * 2;
        const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);
        const imgW = canvas.width * ratio;
        const imgH = canvas.height * ratio;
        const x = (pageW - imgW) / 2;
        const y = margin;
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.98), "JPEG", x, y, imgW, imgH, undefined, "FAST");
        return pdf.output("blob");
      } finally {
        wrapper.remove();
      }
    }

    function shareFileName(report) {
      const unidade = String(report.unidade || "unidade")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "") || "unidade";
      return `fechamento_${unidade}_${report.data}.pdf`;
    }

    function getCachedPdfBlob() {
      const report = currentReport;
      if (!report) return Promise.reject(new Error("Relatorio nao carregado."));
      const { data, unidade } = report;
      if (pdfCache?.data === data && pdfCache?.unidade === unidade) {
        return Promise.resolve(pdfCache.blob);
      }
      if (pendingPdf?.data === data && pendingPdf?.unidade === unidade
          && pendingPdf.version === pdfCacheVersion) {
        return pendingPdf.promise;
      }
      const version = pdfCacheVersion;
      const promise = createPdfBlob()
        .then(blob => {
          if (version === pdfCacheVersion && currentReport === report) {
            pdfCache = { blob, data, unidade };
          }
          return blob;
        })
        .finally(() => {
          if (pendingPdf?.promise === promise) pendingPdf = null;
        });
      pendingPdf = { promise, data, unidade, version };
      return promise;
    }

    async function exportPdf(tryNativeShare = false) {
      const blob = await createPdfBlob();
      const fileName = pdfFileName();
      if (tryNativeShare && window.File && navigator.canShare && navigator.share) {
        const file = new File([blob], fileName, { type: "application/pdf" });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: "Fechamento Diario - Campinas",
            text: `Fechamento Diario Campinas ${fmtDate(currentReport.data)}`,
            files: [file]
          });
          return true;
        }
      }
      downloadBlob(blob, fileName);
      return false;
    }

    async function share(kind) {
      const selectedDate = document.getElementById("dataRel").value || todayYmd();
      if (!currentReport || currentReport.data !== selectedDate) await loadReport();
      if (!currentReport) return;

      const button = document.getElementById(kind === "whatsapp" ? "btnWhatsapp" : "btnTelegram");
      const originalContent = button.innerHTML;
      const cacheReady = pdfCache?.data === currentReport.data
        && pdfCache?.unidade === currentReport.unidade;
      if (!cacheReady) {
        button.disabled = true;
        button.textContent = "Gerando PDF...";
        button.setAttribute("aria-busy", "true");
      }
      const report = currentReport;
      let blob;
      try {
        blob = await getCachedPdfBlob();
      } catch (err) {
        console.warn("PDF nao gerado", err);
        showShareNotice("Não foi possível gerar o PDF.");
        return;
      } finally {
        button.disabled = false;
        button.innerHTML = originalContent;
        button.removeAttribute("aria-busy");
      }

      if (currentReport !== report || document.getElementById("dataRel").value !== report.data) return;
      const file = new File([blob], shareFileName(report), { type: "application/pdf" });
      const title = `Fechamento Diário - ${report.unidade || "Unidade"}`;
      const text = document.getElementById("shareText").value || buildShareText(report);
      let canShareFiles = false;
      try {
        canShareFiles = Boolean(navigator.share && navigator.canShare?.({ files: [file] }));
      } catch (_) {
        canShareFiles = false;
      }
      if (canShareFiles) {
        await copyShareText(text);
        try {
          await navigator.share({ files: [file], title, text });
          showShareNotice("Texto copiado — se não aparecer na conversa, cole");
          return;
        } catch (err) {
          if (err?.name === "AbortError") return;
          console.warn("Compartilhamento de arquivo indisponível", err);
        }
      }

      const encoded = encodeURIComponent(text);
      const url = kind === "whatsapp"
        ? `https://wa.me/?text=${encoded}`
        : `https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encoded}`;
      downloadBlob(blob, file.name);
      await copyShareText(text);
      const opened = window.open(url, "_blank");
      showShareNotice("PDF baixado — anexe na conversa", opened ? "" : url);
    }

    document.getElementById("dataRel").value = todayYmd();
    document.getElementById("dataRel").addEventListener("change", invalidatePdfCache);
    document.getElementById("btnGerar").addEventListener("click", loadReport);
    document.getElementById("btnPdf").addEventListener("click", () => exportPdf(false).catch(() => window.print()));
    document.getElementById("btnWhatsapp").addEventListener("click", () => share("whatsapp"));
    document.getElementById("btnTelegram").addEventListener("click", () => share("telegram"));
    loadReport();
  </script>
