<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b49">
<title>Atualizar Unificado — Concrefer</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f3f6fa;color:#102b49;font:16px/1.5 system-ui,sans-serif}main{width:min(100%,480px);padding:36px;border:1px solid #e3e8f0;border-radius:20px;background:white;box-shadow:0 12px 32px #102b4910}img{width:190px;max-width:100%;margin-bottom:20px}h1{margin:0 0 12px;font-size:27px}p{color:#52677d}button{padding:12px 20px;border:0;border-radius:10px;background:#102b49;color:white;font:inherit;cursor:pointer}button[hidden]{display:none}
</style>
<main><img src="assets/img/logo-concrefer.png" alt="Concrefer"><h1>Atualizando o Unificado</h1><p id="status" role="status">Preparando a versão atual. Aguarde…</p><button id="retry" hidden>Tentar novamente</button></main>
<script>
  const status = document.getElementById('status');
  const retry = document.getElementById('retry');
  async function recover() {
    retry.hidden = true;
    try {
      const root = new URL('/unificado/', location.origin).href;
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.filter(r => r.scope === root).map(r => r.unregister()));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.filter(key => key.startsWith('concrefer-unificado-shell-v')).map(key => caches.delete(key)));
      }
      const response = await fetch('/unificado/VERSION?recover=' + Date.now(), {cache:'no-store'});
      if (!response.ok) throw new Error('version');
      const version = (await response.text()).trim();
      if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('version');
      status.textContent = 'Abrindo a versão ' + version + '…';
      location.replace('/unificado/index.html?atualizar=' + encodeURIComponent(version));
    } catch {
      status.textContent = 'Não foi possível concluir a atualização. Confira sua conexão e tente novamente.';
      retry.hidden = false;
    }
  }
  retry.addEventListener('click', recover);
  recover();
</script>
</html>
