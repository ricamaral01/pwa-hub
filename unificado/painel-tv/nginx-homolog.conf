# Screen and API share the same Unificado permission. No module iframe.
location = /unificado/tv/formas {
    return 302 /unificado/tv/formas/;
}
location = /unificado/tv/formas/ {
    auth_request /unificado/screen-authorize;
    error_page 401 403 = @unificado_screen_denied;
    root /opt/concrefer-unificado/homolog-next/public;
    try_files /unificado/tv/formas/index.html =404;
    add_header Cache-Control "no-store" always;
}
location = /unificado/tv/formas/tv.js {
    auth_request /unificado/screen-authorize;
    error_page 401 403 = @unificado_screen_denied;
    root /opt/concrefer-unificado/homolog-next/public;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
}
location = /unificado/painel-tv/api/resumo {
    auth_request /unificado/screen-authorize;
    error_page 401 403 = @unificado_api_denied;
    proxy_pass http://127.0.0.1:13180/resumo;
    proxy_set_header Host $http_host;
    add_header Cache-Control "no-store" always;
}
