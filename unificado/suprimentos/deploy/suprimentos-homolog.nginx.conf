    location = /unificado/suprimentos {
        return 301 /unificado/suprimentos/;
    }

    location = /unificado/suprimentos-auth {
        internal;
        proxy_pass http://127.0.0.1:13152/unified/suprimentos-authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location = /unificado/suprimentos/session-renew {
        proxy_pass http://127.0.0.1:13152/unified/suprimentos-renew;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/suprimentos/ {
        client_max_body_size 3M;
        auth_request /unificado/suprimentos-auth;
        auth_request_set $suprimentos_assertion $upstream_http_x_suprimentos_assertion;
        error_page 401 = @unificado_api_unauth;
        error_page 403 = @unificado_api_denied;
        proxy_pass http://127.0.0.1:13167/api/suprimentos/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_set_header X-Suprimentos-Assertion $suprimentos_assertion;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /unificado/suprimentos/pwa/manifest.webmanifest {
        auth_request /unificado/suprimentos-auth;
        root /opt/concrefer-unificado/homolog-next/public;
        default_type application/manifest+json;
        add_header Cache-Control "no-store" always;
    }

    location = /unificado/suprimentos/pwa/sw.js {
        auth_request /unificado/suprimentos-auth;
        root /opt/concrefer-unificado/homolog-next/public;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /unificado/suprimentos/ {
        auth_request /unificado/suprimentos-auth;
        error_page 401 403 = @unificado_screen_denied;
        root /opt/concrefer-unificado/homolog-next/public;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
