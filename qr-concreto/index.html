<!doctype html>
<html lang="pt-br" class="auth-checking">
<head>
  <style>html.auth-checking body{visibility:hidden}</style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/auth/config.js?v=2"></script><script defer src="/auth/client.js"></script><script defer src="/auth/guard.js?v=2"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CONCRETRACK • Leitura CP</title>

  <!-- PWA (manifest unificado na raiz) -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#2F3640">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ajuda a reduzir cache do navegador (PWA ainda pode cachear via SW) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>    :root{
      --bg0:#f1f5f9;
      --bg1:#ffffff;
      --bg2:#e2e8f0;

      --card: #ffffff;
      --card2: #f8fafc;

      --line: rgba(0, 0, 0, 0.08);
      --line2: rgba(0, 0, 0, 0.12);

      --text:#0f172a;
      --muted:#64748b;

      --ok:#10b981;
      --err:#ef4444;
      --warn:#f59e0b;
      
      --primary: #1a3a5c;
      --primary-light: #2563a8;
      --accent: #e8762a;

      --shadow: 0 12px 34px rgba(26, 38, 60, 0.08);
    }

    *{ box-sizing:border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    body{
      margin:0;
      color:var(--text);
      background: linear-gradient(135deg, var(--bg0) 0%, var(--bg2) 100%);
      min-height:100vh;
    }
    .wrap{ max-width: 700px; margin:0 auto; padding: 18px; }

    /* Header */
    .title{ font-size:24px; font-weight: 900; letter-spacing:.4px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .sw-badge{
      border:1px solid var(--line2);
      border-radius:999px;
      background:#f8fafc;
      color:var(--muted);
      cursor:pointer;
      font-size:10px;
      font-weight:800;
      line-height:1;
      padding:5px 8px;
      white-space:nowrap;
    }
    .sw-badge:hover{
      background:#e2e8f0;
      color:var(--primary);
    }
    .subtitle{ color:var(--muted); font-size:13px; margin:6px 0 10px; line-height:1.2; font-weight: 500; }
    .accentLine{
      height:4px; width:100%;
      border-radius:999px;
      background: linear-gradient(90deg, var(--accent), var(--primary-light), transparent);
      opacity:.85;
      margin:10px 0 14px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:20px;
      box-shadow:var(--shadow);
      display:grid;
      gap:16px;
      font-size:15px;
    }

    .ops{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{
      padding:14px;
      border-radius:12px;
      border:1px solid var(--line2);
      background: #ffffff;
      color:var(--text);
      font-weight:700;
      font-size:15px;
      cursor:pointer;
      flex:1;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition: transform .05s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:hover{
      background: #f8fafc;
      border-color: rgba(0, 0, 0, 0.2);
    }

    /* Operador selecionado */
    .btn.sel{
      border-color: var(--primary-light);
      background: rgba(37, 99, 168, 0.08);
      color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(37, 99, 168, 0.18);
    }
    .btn.sel:hover{
      background: rgba(37, 99, 168, 0.12);
    }

    /* Ler QR */
    .btn.primary{
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-color: var(--primary);
      color:#ffffff;
    }
    .btn.primary:hover{
      background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    }

    /* Salvar */
    .btn.good{
      background: linear-gradient(135deg, var(--ok) 0%, #059669 100%);
      border-color: #059669;
      color:#ffffff;
      font-size:17px;
      font-weight: 800;
      padding:16px;
      border-radius:14px;
    }
    .btn.good:not([disabled]):hover{
      background: linear-gradient(135deg, #059669 0%, var(--ok) 100%);
    }
    .btn.good[disabled]{
      opacity:.45;
      filter: grayscale(.25);
      cursor:not-allowed;
    }

    /* Dashboard */
    .btn.dark{
      background: #f1f5f9;
      border-color: var(--line2);
      color: var(--text);
    }
    .btn.dark:hover{
      background: #e2e8f0;
    }

    #reader{
      width:100%;
      border-radius:16px;
      overflow:hidden;
      border:1px solid var(--line);
      background:#000;
    }

    .status{ font-weight:700; font-size:15px; padding:2px 8px; border-radius: 6px; background: #f1f5f9; text-transform: uppercase; }
    .ok{ color:var(--ok); background: rgba(16, 185, 129, 0.1); }
    .err{ color:var(--err); background: rgba(239, 68, 68, 0.1); }
    .warn{ color:var(--warn); background: rgba(245, 158, 11, 0.1); }

    .kv{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field{
      background: var(--card2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:10px 14px;
    }
    .label{ font-size:11px; color:var(--muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.6px; }
    .value{ font-size:20px; font-weight:800; margin-top:4px; color: var(--text); }

    .mpaInput{
      font-size:28px;
      font-weight:800;
      padding:14px;
      border-radius:12px;
      border:2px solid var(--line2);
      background: #ffffff;
      color:var(--text);
      width:100%;
      outline:none;
      text-align: center;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .mpaInput:focus{
      box-shadow: 0 0 0 4px rgba(37, 99, 168, 0.15);
      border-color: var(--primary-light);
    }

    .pillRow{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 16px;
      border-radius:20px;
      border:1px solid var(--line);
      background: var(--card2);
      font-weight:700;
      font-size:14px;
    }
    .dot{ width:10px; height:10px; border-radius:999px; background:var(--muted); }
    .dot.ok{ background: var(--ok); }
    .dot.warn{ background: var(--warn); }
    .dot.err{ background: var(--err); }
    .mini{
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      line-height: 1.2;
      padding: 8px 16px;
      border: none;
      background: transparent;
    }

    .modal{
      display:none;
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(15, 23, 42, .6);
      z-index:9999;
      align-items:center;
      justify-content:center;
      backdrop-filter: blur(4px);
    }
    .modal.show{ display:flex; }
    .modal-content{
      background: #ffffff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:28px;
      max-width:360px;
      text-align:center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    .modal-title{
      font-size:24px;
      font-weight:800;
      margin-bottom:12px;
      color:var(--ok);
    }
    .modal-text{
      font-size:16px;
      margin-bottom:20px;
      color:var(--text);
    }
    .modal-btn{
      padding:12px 28px;
      border-radius:12px;
      border:none;
      background:var(--ok);
      color:#ffffff;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      transition: opacity 0.15s;
    }
    .modal-btn:active{ opacity:0.8; }
  </style>

  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body data-app-key="qr-concreto">
<div class="wrap">
  <a href="../index.html" style="display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;margin-bottom:8px;">← Hub</a>
  <div class="title"><img src="../assets/img/leitorqr-icon.png" alt="" style="height:28px;vertical-align:middle;margin-right:6px;"> CONCRETRACK • QR Concreto <button class="sw-badge" id="swVersionBadge" type="button" title="Atualizar app">SW</button></div>
  <div class="subtitle">Ler QR → Digitar MPA → Status automático (Min/Max) → Salvar</div>
  <div class="accentLine"></div>

  <div class="card">

    <div class="ops" id="ops">
      <button class="btn" data-op="Phillipe">Phillipe</button>
      <button class="btn" data-op="Ricardo">Ricardo</button>
    </div>

    <button class="btn primary" id="btnStart">📷 Ler QR</button>

    <div id="reader" style="display:none"></div>

    <div>Status: <span id="status" class="status">aguardando</span></div>

    <div class="kv">
      <div class="field"><div class="label">Traço</div><div id="pv_traco" class="value">—</div></div>
      <div class="field"><div class="label">Moldagem</div><div id="pv_mold" class="value">—</div></div>
      <div class="field"><div class="label">Idade</div><div id="pv_idade" class="value">—</div></div>
      <div class="field"><div class="label">CP</div><div id="pv_cp" class="value">—</div></div>
      <div class="field"><div class="label">Hora</div><div id="pv_hora" class="value">—</div></div>
      <div class="field"><div class="label">Ruptura</div><div id="pv_rupt" class="value">—</div></div>
    </div>

    <input id="mpaInput" class="mpaInput" placeholder="MPA (ex: 21,5)" />

    <div class="pillRow">
      <div class="pill">
        <span id="dotMeta" class="dot"></span>
        <span id="metaTxt">Meta: —</span>
      </div>
      <div class="pill mini" id="helpTxt">Digite o MPA para ver o status.</div>
    </div>

    <button class="btn good" id="btnSave" disabled>💾 SALVAR</button>

    <a class="btn dark" id="btnDash" href="#" target="_blank" rel="noopener">📊 ABRIR DASHBOARD</a>

  </div>
</div>

<div class="modal" id="modalSucesso">
  <div class="modal-content">
    <div class="modal-title">✅ Sucesso!</div>
    <div class="modal-text">Registro foi salvo com sucesso.</div>
    <button class="modal-btn" onclick="fecharModal()">OK</button>
  </div>
</div>

<script>
/* ===============================
   ✅ SW UNIFICADO (registrado pela Home)
   =============================== */
(async function(){
  try{
    if ("serviceWorker" in navigator) {
      await navigator.serviceWorker.register("../sw.js", { scope: "../" });
    }
  }catch(e){}
})();

/* =========================================
   ✅ UPDATE DE CACHE 1x POR DIA (SEM LOOP)
   - pede update do SW 1x por dia
   - não dá reload infinito
   ========================================= */
(async function dailyUpdatePing(){
  try{
    const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
    const last = localStorage.getItem("ct_sw_update_day");
    if (last === today) return;

    localStorage.setItem("ct_sw_update_day", today);

    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.update();
    }
  } catch(e){}
})();

function initSWVersionBadge(){
  const badge = $("swVersionBadge");
  if(!badge || !("serviceWorker" in navigator)) return;

  function setBadge(text){
    badge.textContent = text || "SW";
  }

  async function readVersion(){
    try{
      const reg = await navigator.serviceWorker.ready;
      const worker = navigator.serviceWorker.controller || reg.active || reg.waiting || reg.installing;
      if(!worker) return;
      const channel = new MessageChannel();
      channel.port1.onmessage = event => {
        if(event.data && event.data.version) setBadge(event.data.version);
      };
      worker.postMessage({ type:"GET_VERSION" }, [channel.port2]);
    }catch(e){
      setBadge("SW");
    }
  }

  badge.addEventListener("click", async ()=>{
    setBadge("atualizando...");
    try{
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.update()));
      if("caches" in window){
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
      window.location.reload();
    }catch(e){
      setBadge("erro");
      setTimeout(readVersion, 1200);
    }
  });

  navigator.serviceWorker.ready.then(readVersion).catch(()=>setBadge("SW"));
}

const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyZkdfk8OwLDGAzc2fznPUFS5cDvDgMVRz1nVBtRG1BSIqthuVjTwEY8XD1oyfOKgB9/exec";
const DASH_URL = WEBAPP_URL + "?view=dashboard";
document.getElementById("btnDash").href = DASH_URL;

/**
 * Faixa esperada (Min/Max)
 * 24h = 1 dia
 */
const META_FAIXA = {
  1:  { min: 8,  max: 14 },
  3:  { min: 16, max: 24 },
  7:  { min: 22, max: 32 },
  28: { min: 32, max: 42 }
};

let operador = "";
let lastRaw = "";
let lastParsed = null;
let qr = null;

const $ = id => document.getElementById(id);
const setStatus = (t,c="") => { $("status").textContent=t; $("status").className="status "+c; };
initSWVersionBadge();

function fecharModal(){ $("modalSucesso").classList.remove("show"); }

document.querySelectorAll("#ops .btn").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#ops .btn").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
    operador=b.dataset.op;
    $("btnSave").disabled = !canSave(mpaNumber());
  };
});

$("btnStart").onclick=async()=>{
  if(!operador){ setStatus("selecione operador","err"); return; }
  $("reader").style.display="block";
  qr ??= new Html5Qrcode("reader");

  await qr.start({facingMode:"environment"},{fps:10,qrbox:300},async (txt)=>{
    await qr.stop();
    $("reader").style.display="none";

    lastRaw = txt;
    lastParsed = parseQR(txt);
    preview(lastParsed);

    $("mpaInput").value = "";
    updateMPAStatus();
    $("btnSave").disabled = true;

    setStatus("QR lido • digite o MPA","warn");
    $("mpaInput").focus();
  });
};

$("mpaInput").addEventListener("input", ()=>{
  updateMPAStatus();
  $("btnSave").disabled = !canSave(mpaNumber());
});

$("btnSave").onclick=()=>send();

function parseQR(raw){
  const o={traco_id:"",traco_nome:"",cp:"",idade_dias:"",data_moldagem:"",hora_moldagem:"",data_ruptura:"",qr_raw:raw};
  raw.split("|").forEach(p=>{
    const [k,v]=p.split("=");
    if(!v)return;
    if(k=="traco")o.traco_id=v;
    if(k=="nome")o.traco_nome=v;
    if(k=="cp")o.cp=v;
    if(k=="idade")o.idade_dias=v;
    if(k=="mold")o.data_moldagem=v;
    if(k=="hora")o.hora_moldagem=v;
    if(k=="rupt")o.data_ruptura=v;
  });
  return o;
}

function formatData(data){
  if(!data) return "—";
  if(String(data).includes("-")) {
    const [y,m,d]=String(data).split("-");
    return `${d}/${m}/${y}`;
  }
  return String(data);
}

function preview(p){
  $("pv_traco").textContent = p.traco_id || "—";
  $("pv_cp").textContent    = p.cp || "—";
  $("pv_idade").textContent = p.idade_dias || "—";
  $("pv_mold").textContent  = formatData(p.data_moldagem);
  $("pv_hora").textContent  = p.hora_moldagem || "—";
  $("pv_rupt").textContent  = formatData(p.data_ruptura);
}

function mpaNumber(){
  const s = String($("mpaInput").value||"").trim().replace(",",".");
  const cleaned = s.replace(/[^0-9.]/g,"");
  if(!cleaned) return null;
  const i = cleaned.indexOf(".");
  const normalized = (i === -1) ? cleaned : (cleaned.slice(0,i+1) + cleaned.slice(i+1).replace(/\./g,""));
  const v = Number(normalized);
  return Number.isFinite(v) ? v : null;
}

function calcMetaStatus(mpa){
  const idade = Number(lastParsed?.idade_dias || "");
  const meta = META_FAIXA[idade];
  if(!meta) return { status:"SEM_META", label:"Meta: — (idade sem faixa)", dot:"warn", metaMin:"", metaMax:"" };
  if(mpa == null) return { status:"SEM_MPA", label:`Meta: ${meta.min}–${meta.max} MPa`, dot:"warn", metaMin:meta.min, metaMax:meta.max };

  if(mpa < meta.min) return { status:"ABAIXO", label:`Meta: ${meta.min}–${meta.max} • ABAIXO ❌`, dot:"err", metaMin:meta.min, metaMax:meta.max };
  if(mpa > meta.max) return { status:"ACIMA",  label:`Meta: ${meta.min}–${meta.max} • ACIMA ⚠️`, dot:"warn", metaMin:meta.min, metaMax:meta.max };
  return { status:"DENTRO", label:`Meta: ${meta.min}–${meta.max} • DENTRO ✅`, dot:"ok", metaMin:meta.min, metaMax:meta.max };
}

function updateMPAStatus(){
  const mpa = mpaNumber();
  const s = calcMetaStatus(mpa);
  $("metaTxt").textContent = s.label;
  $("dotMeta").className = "dot " + (s.dot || "");
  $("helpTxt").textContent = (mpa == null) ? "Digite o MPA para ver o status." : "Clique em SALVAR.";
}

function canSave(mpa){
  if(!operador) return false;
  if(!lastParsed) return false;
  if(mpa == null || mpa <= 0 || mpa >= 200) return false;
  if(!lastParsed.traco_id || !lastParsed.cp || !lastParsed.idade_dias) return false;
  return true;
}

async function postToAppsScript(payload){
  await fetch(WEBAPP_URL + "?t=" + Date.now(),{
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
}

async function send(){
  const mpa = mpaNumber();
  if(!canSave(mpa)){ setStatus("verifique QR + MPA + operador","err"); return; }

  const meta = calcMetaStatus(mpa);
  const payload = {
    operador,
    mpa: String(mpa),
    status_meta: meta.status,
    meta_min: meta.metaMin,
    meta_max: meta.metaMax,
    ...lastParsed,
    qr_raw:lastRaw,
    timestamp:new Date().toISOString()
  };

  setStatus("salvando...","warn");
  $("btnSave").disabled = true;

  try{
    await postToAppsScript(payload);
    setStatus("enviado para planilha ✅","ok");
    $("mpaInput").value="";
    $("btnSave").disabled = true;
    updateMPAStatus();
    $("btnDash").href = DASH_URL;
    $("modalSucesso").classList.add("show");
  }catch(e){
    setStatus("erro envio: " + (e?.message || e), "err");
    $("btnSave").disabled = false;
  }
}
</script>
</body>
</html>
