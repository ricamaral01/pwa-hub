server {
  listen 80;
  server_name dautomacao.com www.dautomacao.com;

  # ConcreTrack ERP em /concretrack
  location = /concretrack {
    return 301 /concretrack/;
  }

  location ^~ /concretrack/ {
    alias /var/www/concretrack-erp/public/;
    try_files $uri $uri/ /concretrack/index.html;
  }
}
