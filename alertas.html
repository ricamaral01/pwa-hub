<!doctype html>
<html lang="pt-br" class="auth-checking">
<head>
  <style>html.auth-checking body{visibility:hidden}</style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/auth/config.js"></script><script defer src="/auth/client.js"></script><script defer src="/auth/guard.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alertas — ConcreTrack</title>
  <link rel="icon" type="image/png" href="./assets/img/logo-concretrack.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2F3640">
  <link rel="stylesheet" href="./styles.css">
  <style>
    body { padding: 20px 16px 56px; }

    .header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .badge-count {
      display: inline-block;
      background: rgba(245,158,11,.18);
      color: var(--warn);
      border: 1px solid rgba(245,158,11,.35);
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      padding: 2px 9px;
      margin-left: 8px;
      vertical-align: middle;
    }

    .btn-clear {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.30);
      color: var(--err);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-clear:hover { background: rgba(239,68,68,.22); }

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alert-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px 12px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

    .alert-item.ok   { border-left-color: var(--ok); }
    .alert-item.warn { border-left-color: var(--warn); }

    .alert-icon {
      font-size: 1.45rem;
      line-height: 1;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .alert-body { flex: 1; min-width: 0; }

    .alert-title {
      font-weight: 800;
      font-size: .92rem;
      line-height: 1.3;
    }

    .alert-msg {
      font-size: .81rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .alert-time {
      font-size: .71rem;
      color: var(--muted);
      margin-top: 7px;
      opacity: .65;
    }

    .empty {
      text-align: center;
      padding: 52px 24px;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 14px; }
    .empty-title { font-weight: 800; font-size: 1rem; margin-bottom: 6px; }
    .empty-sub { font-size: .82rem; opacity: .7; line-height: 1.5; }
  </style>
</head>
<body data-app-key="alertas">
  <div class="wrap">
    <a class="back" href="./index.html">← Hub</a>

    <div class="header-row">
      <div>
        <div class="title">🔔 Alertas<span class="badge-count" id="badge" style="display:none"></span></div>
        <div class="subtitle">Histórico de notificações do sistema</div>
      </div>
      <button class="btn-clear" id="btnClear" onclick="clearAll()" style="display:none">Limpar tudo</button>
    </div>

    <div class="accentLine"></div>

    <div id="list" class="alert-list"></div>
  </div>

<script>
const DB_NAME = 'ct-alerts-db';
const DB_VER  = 1;

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore('alerts', { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = e => rej(e.target.error);
  });
}

async function loadAlerts() {
  const db  = await openDB();
  const req = db.transaction('alerts', 'readonly').objectStore('alerts').getAll();
  return new Promise((res, rej) => {
    req.onsuccess = () => res(req.result.slice().reverse()); // newest first
    req.onerror   = () => rej(req.error);
  });
}

async function clearAll() {
  if (!confirm('Limpar todo o histórico de alertas?')) return;
  const db = await openDB();
  const tx = db.transaction('alerts', 'readwrite');
  tx.objectStore('alerts').clear();
  tx.oncomplete = () => render();
}

function relTime(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1)  return 'agora mesmo';
  if (m < 60) return `há ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `há ${h}h`;
  const d = Math.floor(h / 24);
  return `há ${d} dia${d > 1 ? 's' : ''}`;
}

function absTime(ts) {
  return new Date(ts).toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit', year: '2-digit',
    hour: '2-digit', minute: '2-digit'
  });
}

function alertClass(title) {
  if (!title) return '';
  if (title.includes('✅')) return 'ok';
  if (title.includes('⚠'))  return 'warn';
  return '';
}

function alertIcon(title) {
  if (!title) return '🔔';
  if (title.includes('✅')) return '✅';
  if (title.includes('⚠'))  return '⚠️';
  return '🔔';
}

async function render() {
  const listEl   = document.getElementById('list');
  const clearBtn = document.getElementById('btnClear');
  const badge    = document.getElementById('badge');

  let alerts = [];
  try { alerts = await loadAlerts(); } catch (_) {}

  if (alerts.length === 0) {
    listEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔕</div>
        <div class="empty-title">Nenhuma notificação ainda</div>
        <div class="empty-sub">Os alertas aparecerão aqui assim que forem recebidos pelo dispositivo.</div>
      </div>`;
    clearBtn.style.display = 'none';
    badge.style.display    = 'none';
    return;
  }

  clearBtn.style.display = '';
  badge.style.display    = '';
  badge.textContent      = alerts.length;

  listEl.innerHTML = alerts.map(a => `
    <div class="alert-item ${alertClass(a.title)}">
      <div class="alert-icon">${alertIcon(a.title)}</div>
      <div class="alert-body">
        <div class="alert-title">${escHtml(a.title || 'Alerta')}</div>
        ${a.body ? `<div class="alert-msg">${escHtml(a.body)}</div>` : ''}
        <div class="alert-time">${absTime(a.ts)} &nbsp;·&nbsp; ${relTime(a.ts)}</div>
      </div>
    </div>
  `).join('');
}

render();
</script>
</body>
</html>
