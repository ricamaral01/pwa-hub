##############################################################
# DAUTOMACAO.COM — HTTPS + HTTP→HTTPS redirect
##############################################################

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dautomacao.com www.dautomacao.com usina.concretrack.com.br _;
    return 301 https://$host$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dautomacao.com www.dautomacao.com usina.concretrack.com.br;

    ssl_certificate     /etc/letsencrypt/live/dautomacao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dautomacao.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Segurança
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Raiz → /concretrack/
    location = / {
        return 301 /concretrack/;
    }

    # ConcreTrack — página principal e subpáginas (estático)
    location = /concretrack {
        return 301 /concretrack/;
    }

    location = /concretrack/relatorio-sistema.html {
        return 404;
    }

    location = /mapa-concretagem {
        return 301 /mapa-concretagem/;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location ^~ /api/inspecoes/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        client_max_body_size 20M;
    }

    location ^~ /api/fotos/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location ^~ /mapa-concretagem/ {
        alias /opt/resultado-ensaios-usina/current/mapa-concretagem/;
        index index.html;
        try_files $uri $uri/ /mapa-concretagem/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /concretrack/mapa-concretagem {
        return 301 /concretrack/mapa-concretagem/;
    }

    location ^~ /concretrack/mapa-concretagem/ {
        alias /opt/resultado-ensaios-usina/current/mapa-concretagem/;
        index index.html;
        try_files $uri $uri/ /concretrack/mapa-concretagem/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /concretrack/ {
        alias /var/www/concretrack-erp/public/;
        index index.html;
        try_files $uri $uri/ $uri/index.html /concretrack/index.html;

        # Sem cache em HTML — força reload sempre
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # /usina → Flask
    location /usina {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API usina → Flask
    location /api/usina/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard produção → Flask
    location /dashboard {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API ERP (FastAPI porta 8010)
    location ^~ /concretrack/api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Etiquetas CP — Flask porta 5050
    location = /etiquetas {
        return 301 /etiquetas/;
    }
    location ^~ /etiquetas/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /etiquetas/;
    }

    # Evolution API — WhatsApp do agente PCP
    location = /evolution {
        return 301 /evolution/;
    }

    location ^~ /evolution/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Relatórios publicados pelo agente PCP
    location ^~ /relatorios/ {
        alias /opt/pcp-producao-publisher/relatorios/;
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # QR Concreto legado: todas as leituras passam pelo CEC autenticado do ERP.
    location = /qr-concreto {
        return 302 https://dautomacao.com/concretrack/cec/leitura/;
    }

    location ^~ /qr-concreto/ {
        return 302 https://dautomacao.com/concretrack/cec/leitura/;
    }

    # Fallback → Flask
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
