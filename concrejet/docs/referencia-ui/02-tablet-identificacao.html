<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tablet · Identificação e abertura</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<figure class="moldura">
  <figcaption>Tablet · 1280 × 800 · /posto — identificação do operador</figcaption>
  <div class="tela tela-tablet">
    <div class="posto">

      <header class="posto-topo">
        <div class="placa">
          <span class="placa-num num">05</span>
          <span class="placa-nome">Sandretto 220 t</span>
        </div>
        <span class="lampada l-ocioso">Ociosa · sem apontamento aberto</span>
        <div class="direita">
          <span class="sinc">✓ Sincronizado 10:19</span>
          <span class="sinc">◷ 10:22</span>
        </div>
      </header>

      <div class="posto-corpo" style="grid-template-columns:1fr 380px">

        <section class="cartao">
          <p class="cartao-titulo">Quem está operando</p>
          <div class="grade" style="grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;height:calc(100% - 26px)">
            <div class="bloco marcado"><b>Edney R.</b><span>mat. 1042 · injetor</span></div>
            <div class="bloco"><b>Marcos A.</b><span>mat. 1188 · injetor</span></div>
            <div class="bloco"><b>Juliana P.</b><span>mat. 1207 · injetor</span></div>
            <div class="bloco"><b>Reinaldo C.</b><span>mat. 0931 · líder</span></div>
            <div class="bloco"><b>Silvana M.</b><span>mat. 1310 · montagem</span></div>
            <div class="bloco"><b>Tiago F.</b><span>mat. 1266 · injetor</span></div>
            <div class="bloco"><b>Wesley D.</b><span>mat. 1355 · injetor</span></div>
            <div class="bloco"><b>Amanda S.</b><span>mat. 1401 · montagem</span></div>
            <div class="bloco" style="justify-content:center;align-items:center"><b style="color:var(--tinta-3)">Ver todos</b></div>
          </div>
        </section>

        <section class="cartao">
          <p class="cartao-titulo">Senha de 4 dígitos</p>
          <div style="display:flex;gap:12px;justify-content:center;margin:6px 0 14px">
            <span class="num" style="width:56px;height:64px;border:1px solid var(--linha-forte);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--superficie)">•</span>
            <span class="num" style="width:56px;height:64px;border:1px solid var(--linha-forte);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--superficie)">•</span>
            <span class="num" style="width:56px;height:64px;border:1px solid var(--acao);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--acao-bg)"></span>
            <span class="num" style="width:56px;height:64px;border:1px solid var(--linha-forte);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--superficie)"></span>
          </div>
          <div class="teclado" style="height:calc(100% - 126px)">
            <div class="tecla">1</div><div class="tecla">2</div><div class="tecla">3</div>
            <div class="tecla">4</div><div class="tecla">5</div><div class="tecla">6</div>
            <div class="tecla">7</div><div class="tecla">8</div><div class="tecla">9</div>
            <div class="tecla aux">Apagar</div><div class="tecla">0</div><div class="tecla aux" style="background:var(--acao);color:#fff;border-color:var(--acao)">Entrar</div>
          </div>
        </section>

      </div>

      <div class="aviso" style="background:var(--superficie);color:var(--tinta-2);border:1px solid var(--linha)">
        Este tablet está vinculado à injetora 05. Para trocar de máquina, chame o líder.
      </div>

    </div>
  </div>
</figure>

<figure class="moldura">
  <figcaption>Tablet · 1280 × 800 · /posto/abertura — o que vai rodar</figcaption>
  <div class="tela tela-tablet">
    <div class="posto">

      <header class="posto-topo">
        <div class="placa">
          <span class="placa-num num">05</span>
          <span class="placa-nome">Sandretto 220 t</span>
        </div>
        <span class="lampada l-ocioso">Aguardando abertura</span>
        <div class="direita">
          <span class="sinc">✓ Sincronizado 10:19</span>
          <div class="operador"><b>Edney R.</b><span>mat. 1042</span></div>
        </div>
      </header>

      <div class="posto-corpo" style="grid-template-columns:1fr 1fr 1fr">

        <section class="cartao">
          <p class="cartao-titulo">1 · Operação</p>
          <div class="grade" style="grid-auto-rows:1fr;height:calc(100% - 26px)">
            <div class="bloco marcado"><b>Injeção</b><span>com resina e perdas</span></div>
            <div class="bloco"><b>Montagem de caixas</b><span>só quantidade</span></div>
            <div class="bloco"><b>Solda</b><span>só quantidade</span></div>
            <div class="bloco"><b>Mistura de resinas</b><span>gera lote novo</span></div>
            <div class="bloco"><b>Montagem de postes</b><span>só quantidade</span></div>
          </div>
        </section>

        <section class="cartao">
          <p class="cartao-titulo">2 · Ordem de produção</p>
          <div class="grade" style="grid-auto-rows:1fr;height:calc(100% - 26px)">
            <div class="bloco marcado"><b class="num">53190</b><span>10495 · Tampa disjuntor ECD · 5.000 pç</span></div>
            <div class="bloco"><b class="num">53204</b><span>10871 · Caixa PC preta poste · 2.400 pç</span></div>
            <div class="bloco"><b class="num">53211</b><span>10233 · Bucha estrela PP · 18.000 pç</span></div>
            <div class="bloco"><b style="color:var(--tinta-3)">Sem O.P.</b><span>produção avulsa</span></div>
            <div class="bloco" style="justify-content:center;align-items:center"><b style="color:var(--tinta-3)">Ver todas</b></div>
          </div>
        </section>

        <section class="cartao">
          <p class="cartao-titulo">3 · Lote de resina</p>
          <div class="grade" style="grid-auto-rows:1fr;height:calc(100% - 26px)">
            <div class="bloco marcado"><b class="num">2801/26</b><span>PC cinza granulado · STS · saldo 1.240 kg</span></div>
            <div class="bloco"><b class="num">2794/26</b><span>PC cinza granulado · STS · saldo 85 kg</span></div>
            <div class="bloco"><b class="num">B-0117</b><span>Blenda PC 70/30 · saldo 430 kg</span></div>
            <div class="bloco"><b class="num">2712/26</b><span>PC cinza moído · interno · saldo 260 kg</span></div>
            <div class="bloco" style="justify-content:center;align-items:center"><b style="color:var(--tinta-3)">Ver todos</b></div>
          </div>
        </section>

      </div>

      <nav class="acoes" style="grid-template-columns:1fr 3fr">
        <div class="botao botao-grande">Cancelar</div>
        <div class="botao botao-primario botao-grande">Iniciar apontamento · 10:22</div>
      </nav>

    </div>
  </div>
</figure>

</body>
</html>
