<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Painel de Controle Usina • ConcreTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/concretrack/static/css/theme.css" rel="stylesheet">
  <link href="/concretrack/static/css/dashboard.css" rel="stylesheet">
  <link rel="icon" href="/concretrack/static/img/logo-128.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { font-family: "Gotham", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  </style>
</head>
<body style="background:var(--bg);">
  <div class="app-topbar">
    <div class="container">
      <div class="brand-wrap" style="width:100%;">
        <img class="logo" src="/concretrack/static/img/logo-128.png" alt="ConcreTrack Logo">
        <span id="statusDot" class="status-dot"></span>
        <div style="min-width:0">
          <p class="title mb-0">Painel de Controle Usina</p>
          <p class="subtitle mb-0">ConcreTrack @ 2026 • Atualização automática ativa • <span id="clock">--/--/---- --:--:--</span></p>
        </div>
        <div class="ms-auto" style="margin-left:auto">
          <button class="btn btn-light" onclick="window.location.href='/concretrack/';">← Voltar pra Home</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid py-3">
    <div class="mb-3">
      <b>Unidade:</b> <span id="unidade">—</span>
      &nbsp;|&nbsp;
      <b>Data:</b> <span id="dataRef">—</span>
      &nbsp;|&nbsp;
      <b>Atualizado:</b> <span id="lastUpdate">—</span>
    </div>
    <div class="row g-3">
      <div class="col-12 col-md-6 col-xl-3">
        <div class="card p-3">
          <div class="kpi-label">Produção Total (m³)</div>
          <div id="kpiTotal" class="kpi-value">—</div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-xl-3">
        <div class="card p-3">
          <div class="kpi-label">Massadas</div>
          <div id="kpiMassadas" class="kpi-value">—</div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-xl-3">
        <div class="card p-3">
          <div class="kpi-label">Produtividade (m³/h)</div>
          <div id="kpiM3h" class="kpi-value">—</div>
        </div>
      </div>
      <div class="col-12 col-md-6 col-xl-3">
        <div class="card p-3">
          <div class="kpi-label">Status Usina</div>
          <div id="kpiStatus" class="kpi-value" style="font-size:22px">—</div>
          <div id="kpiStatusHint" style="font-size:12px;color:#64748b">—</div>
        </div>
      </div>
    </div>
    <div class="card mt-4">
      <div class="card-header fw-bold">Produção por Hora</div>
      <div class="p-3">
        <canvas id="chartHoras"></canvas>
      </div>
    </div>
  </div>

  <script src="/concretrack/static/js/app.js"></script>
  <script src="/concretrack/static/js/clock.js"></script>
  <script>
    const AUTO_REFRESH = 120000;
    let chartHoras = null;

    function mockData(){
      return{
        meta:{
          unidade:"Campinas",
          dataRef:new Date().toLocaleDateString("pt-BR"),
          lastUpdate:new Date().toLocaleString("pt-BR"),
          status:"NORMAL",
          statusHint:"Operação dentro do ritmo"
        },
        kpis:{
          total:104.5,
          massadas:118,
          m3h:11.6
        },
        horas:[
          {hora:"06",m3:8},
          {hora:"07",m3:11},
          {hora:"08",m3:13},
          {hora:"09",m3:12},
          {hora:"10",m3:10},
          {hora:"11",m3:7},
          {hora:"12",m3:6}
        ]
      }
    }

    function setStatus(status){
      const dot = document.getElementById("statusDot");
      dot.className = "status-dot";
      if(status === "ATENCAO") dot.classList.add("warn");
      if(status === "PARADA") dot.classList.add("stop");
    }

    function renderChart(horas){
      const ctx = document.getElementById("chartHoras");
      if(chartHoras) chartHoras.destroy();
      chartHoras = new Chart(ctx,{
        type:"line",
        data:{
          labels: horas.map(x => x.hora + ":00"),
          datasets:[{
            data: horas.map(x => x.m3),
            tension: .35,
            borderColor: getComputedStyle(document.documentElement).getPropertyValue('--blue'),
            backgroundColor: "rgba(21, 65, 111, 0.12)",
            fill: true,
          }]
        },
        options:{
          plugins:{ legend:{ display:false } },
          scales:{ y:{ beginAtZero:true } }
        }
      });
    }

    function applyData(data){
      document.getElementById("unidade").textContent = data.meta.unidade;
      document.getElementById("dataRef").textContent = data.meta.dataRef;
      document.getElementById("lastUpdate").textContent = data.meta.lastUpdate;
      setStatus(data.meta.status);
      document.getElementById("kpiStatus").textContent = data.meta.status;
      document.getElementById("kpiStatusHint").textContent = data.meta.statusHint;
      document.getElementById("kpiTotal").textContent = data.kpis.total.toString().replace(".",",");
      document.getElementById("kpiMassadas").textContent = data.kpis.massadas;
      document.getElementById("kpiM3h").textContent = data.kpis.m3h.toString().replace(".",",");
      renderChart(data.horas);
    }

    async function loadDashboard(){
      // Futuro: substituir mock por chamada para API real
      const data = mockData();
      applyData(data);
    }

    loadDashboard();
    setInterval(loadDashboard, AUTO_REFRESH);
  </script>
</body>
</html>
