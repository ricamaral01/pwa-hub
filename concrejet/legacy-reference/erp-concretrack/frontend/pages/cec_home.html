<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CEC • ConcreTrack ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body>
  <div id="header"></div>

        <button class="btn btn-light" disabled>Em breve</button>
      </div>
      <div class="card p-4">

      </div>
      <div class="card p-4">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h2 class="fw-semibold mb-0">Dashboard</h2>
          <span class="badge-soon">Em breve</span>
        </div>

        <button class="btn btn-light" disabled>Em breve</button>
      </div>
      <div class="card p-4">
        <div class="d-flex align-items-center gap-2 mb-2">
          <h2 class="fw-semibold mb-0">Etiquetas</h2>
          <span class="badge-soon">Em breve</span>
        </div>
        <p>Etiquetas e rastreabilidade.</p>
        <button class="btn btn-light" disabled>Em breve</button>
      </div>

  <div id="footer"></div>
  <script src="/concretrack/static/js/app.js"></script>
  <script>
    loadFragment("header", "/frontend/shared/header.html");
    loadFragment("footer", "/frontend/shared/footer.html");

</html>
