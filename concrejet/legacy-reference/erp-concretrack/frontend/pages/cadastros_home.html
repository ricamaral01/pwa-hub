<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastros • ConcreTrack ERP</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/concretrack/static/css/theme.css">
  <link rel="icon" href="/concretrack/static/img/logo-128.png">
</head>
<body>
  <div id="header"></div>
  <div class="container" style="margin-top:32px;">
    <h1 class="fw-bold mb-3">Cadastros</h1>
    <div class="grid cards-3 fade-in">
      <div class="card p-4">
        <h2 class="fw-semibold">Cartas Traço</h2>
        <p>Cadastre e gerencie cartas traço.</p>
        <span style="font-size:2em">📄</span>
        <button class="btn btn-primary mt-3" onclick="go('/cadastros/cartas-traco')">Abrir</button>
      </div>
      <div class="card p-4">
        <h2 class="fw-semibold">Agregados e Fornecedores</h2>
        <p>Cadastre materiais e fornecedores.</p>
        <span style="font-size:2em">🪨</span>
        <button class="btn btn-primary mt-3" onclick="go('/cadastros/agregados')">Abrir</button>
      </div>
      <div class="card p-4">
        <div class="d-flex align-items-center gap-2">
          <h2 class="fw-semibold mb-0">Outros</h2>
          <span class="badge-soon">Em breve</span>
        </div>
        <p>Novos cadastros serão adicionados.</p>
        <span style="font-size:2em">➕</span>
        <button class="btn btn-light mt-3" disabled>Em breve</button>
      </div>
    </div>
  </div>
  <div id="footer"></div>
  <script src="/concretrack/static/js/app.js"></script>
  <script>
    loadFragment("header", "/frontend/shared/header.html");
    loadFragment("footer", "/frontend/shared/footer.html");
  </script>
</body>
</html>
