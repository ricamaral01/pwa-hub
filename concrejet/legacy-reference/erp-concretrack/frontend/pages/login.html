<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ConcreTrack ERP • Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/concretrack/static/css/theme.css">
  <link rel="icon" href="/concretrack/static/img/logo-128.png">
  <style>
    body { background: var(--bg); }
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .login-card { max-width: 420px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.08); border-radius: 18px; padding: 32px; background: #fff; }
    .logo { width: 64px; height: 64px; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="d-flex align-items-center gap-3 mb-3">
        <img src="/concretrack/static/img/logo-128.png" alt="ConcreTrack" class="logo">
        <div>
          <p class="mb-0 fw-semibold" style="color:var(--ink)">ConcreTrack ERP</p>
          <small style="color:#64748b">Acesso restrito</small>
        </div>
      </div>
      <form id="loginForm" class="mt-3">
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
        <div id="error" class="text-danger mt-3" style="display:none"></div>
      </form>
    </div>
  </div>

  <script type="module">
    const BASE_PATH = "/concretrack";
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("error");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.style.display = "none";

      const payload = {
        username: form.username.value.trim(),
        password: form.password.value,
      };

      try {
        const res = await fetch(`${BASE_PATH}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          showError("Usuário ou senha inválidos.");
          return;
        }

        window.location.replace(`${BASE_PATH}/`);
      } catch (err) {
        showError("Falha ao conectar. Tente novamente.");
      }
    });
  </script>
</body>
</html>
