<!DOCTYPE html>
<html lang="pt-BR" class="auth-checking">
<head>
  <style>html.auth-checking body{visibility:hidden}</style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/auth/config.js"></script><script defer src="/auth/client.js"></script><script defer src="/auth/guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas Traço — Concrefer Unidades</title>
  <link rel="icon" type="image/png" href="../assets/img/logo-concretrack.png">
  <link rel="apple-touch-icon" href="../assets/img/logo-concretrack.png">
  <style>
    :root {
      --primary:       #1a3a5c;
      --primary-light: #2563a8;
      --accent:        #e8762a;
      --bg:            #f0f4f8;
      --bg2:           #ffffff;
      --card-bg:       rgba(0,0,0,0.04);
      --card-border:   rgba(0,0,0,0.10);
      --text:          #1a2840;
      --muted:         #5a6a7e;
      --radius:        18px;
      --shadow:        0 8px 28px rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #f0f4f8 0%, #ffffff 60%, #eef2f7 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: rgba(255,255,255,0.92);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar-brand img {
      height: 40px;
      width: 40px;
      object-fit: contain;
      border-radius: 10px;
    }
    .topbar-brand .brand-name {
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .04em;
      line-height: 1.1;
    }
    .topbar-brand .brand-name span { color: var(--accent); }
    .topbar-brand .brand-sub {
      font-size: .65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 2px;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.07);
      border: 1px solid rgba(0,0,0,0.18);
      border-radius: 10px;
      color: var(--text);
      font-size: .85rem;
      font-weight: 700;
      padding: 8px 16px;
      text-decoration: none;
      transition: background .15s, transform .1s;
    }
    .btn-back:hover {
      background: rgba(0,0,0,0.12);
      transform: translateY(-1px);
    }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 44px 20px 32px;
    }
    .hero-icon {
      font-size: 3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      background: linear-gradient(135deg, #1a3a5c 0%, #2563a8 100%);
      box-shadow: 0 8px 28px rgba(37,99,168,0.38);
      margin-bottom: 18px;
    }
    .hero h1 {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: .02em;
      margin-bottom: 8px;
    }
    .hero h1 span { color: var(--accent); }
    .hero p {
      font-size: .9rem;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.55;
    }
    .accent-line {
      width: 60px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 16px auto 0;
    }

    /* ── MAIN CONTENT ── */
    main {
      flex: 1;
      padding: 0 20px 60px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      margin: 32px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--card-border);
    }

    /* ── UNIT GRID ── */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    /* ── UNIT CARD ── */
    .unit-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: background .15s, transform .12s, box-shadow .15s, border-color .15s;
      position: relative;
      overflow: hidden;
    }
    .unit-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), #2563a8);
      opacity: 0;
      transition: opacity .2s;
    }
    .unit-card:hover {
      background: rgba(0,0,0,0.06);
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: rgba(0,0,0,0.18);
    }
    .unit-card:hover::before { opacity: 1; }

    .unit-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      flex-shrink: 0;
      transition: transform .15s;
    }
    .unit-card:hover .unit-icon { transform: scale(1.08); }

    .unit-name {
      font-size: .95rem;
      font-weight: 800;
      text-align: center;
      line-height: 1.2;
    }
    .unit-desc {
      font-size: .72rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
    }
    .unit-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .04em;
      background: rgba(232,118,42,0.15);
      color: var(--accent);
      border: 1px solid rgba(232,118,42,0.28);
      margin-top: 2px;
    }
    .unit-badge.active {
      background: rgba(37,180,100,0.13);
      color: #4ced9a;
      border-color: rgba(37,180,100,0.28);
    }

    /* ── INFO BOX ── */
    .info-box {
      background: rgba(37,99,168,0.08);
      border: 1px solid rgba(37,99,168,0.20);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: .82rem;
      color: #1d4ed8;
      margin-top: 28px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      line-height: 1.5;
    }
    .info-box .info-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }

    /* ── FOOTER ── */
    .page-footer {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      opacity: .5;
      padding: 20px 20px 32px;
    }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: #162a44;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      padding: 28px 26px 24px;
      max-width: 480px;
      width: 100%;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: slideUp .2s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(18px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 14px; right: 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      transition: color .15s;
    }
    .modal-close:hover { color: var(--text); }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .modal-header .modal-unit-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: rgba(0,0,0,0.30);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .modal-header h2 {
      font-size: 1.1rem;
      font-weight: 900;
      line-height: 1.15;
    }
    .modal-header p {
      font-size: .72rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Placeholder content inside modal */
    .modal-placeholder {
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
    }
    .modal-placeholder .placeholder-icon { font-size: 2.2rem; margin-bottom: 12px; }
    .modal-placeholder h3 { font-size: .95rem; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .modal-placeholder p { font-size: .8rem; line-height: 1.5; }

    .modal-placeholder .badge-soon {
      display: inline-block;
      margin-top: 14px;
      background: rgba(232,118,42,0.18);
      color: var(--accent);
      border: 1px solid rgba(232,118,42,0.35);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .06em;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .unit-grid { grid-template-columns: repeat(2, 1fr); }
      .hero h1   { font-size: 1.3rem; }
    }

    @media print { .topbar, .btn-back { display: none !important; } }

    /* ── KV CHIPS ── */
    .kv-chip {
      display: inline-flex;
      flex-direction: column;
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: .7rem;
      gap: 2px;
    }
    .kv-chip span { color: var(--muted); }
    .kv-chip strong { font-size: .88rem; color: var(--text); }
    .kv-chip-ok { border-color: rgba(5,150,105,0.30); background: rgba(5,150,105,0.08); }
    .kv-chip-ok strong { color: #059669; }

    /* ── TRACO GROUP ── */
    .traco-group {
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .traco-group--ativo {
      border-color: rgba(5,150,105,0.30);
      background: rgba(5,150,105,0.04);
    }
    .traco-group-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 12px 16px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .traco-nome {
      font-size: .97rem;
      font-weight: 900;
      letter-spacing: .01em;
    }
    .badge-ativo {
      display: inline-block;
      margin-left: 8px;
      background: rgba(5,150,105,0.12);
      color: #059669;
      border: 1px solid rgba(5,150,105,0.28);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .05em;
    }
    .badge-inativo {
      display: inline-block;
      margin-left: 8px;
      background: rgba(0,0,0,0.05);
      color: var(--muted);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: .65rem;
      font-weight: 700;
    }
    .badge-automacao {
      display: inline-block;
      margin-left: 6px;
      background: rgba(37,99,168,0.12);
      color: #1d4ed8;
      border: 1px solid rgba(37,99,168,0.22);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: .62rem;
      font-family: monospace;
    }
    .traco-versions-count {
      font-size: .68rem;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 3px;
    }
    .traco-detail-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 16px 14px;
    }

    /* ── COMPARE STRIP ── */
    .compare-strip {
      border-top: 1px solid var(--card-border);
      padding: 12px 16px 14px;
    }
    .compare-strip-title {
      font-size: .72rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .compare-table-wrap { overflow-x: auto; }
    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: .75rem;
    }
    .compare-table th {
      background: rgba(0,0,0,0.05);
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 7px 10px;
      text-align: left;
      white-space: nowrap;
    }
    .compare-table td {
      padding: 7px 10px;
      border-top: 1px solid rgba(0,0,0,0.07);
      color: var(--text);
      white-space: nowrap;
    }
    .compare-table .row-ativo td { background: rgba(5,150,105,0.05); }

    /* ── MCC SECTION ── */
    .mcc-section {
      margin-top: 16px;
      border-top: 1px dashed rgba(255,255,255,0.12);
      padding-top: 14px;
    }
    .mcc-title {
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ══════════════════════════════════════════
       NOVO DESIGN — DASHBOARD CARTAS TRAÇO
    ══════════════════════════════════════════ */
    :root {
      --c-lig: #3730a3;
      --c-agr: #b45309;
      --c-qui: #0284c7;
    }

    /* ── TABS BAR ── */
    .tabs-bar {
      display: flex; overflow-x: auto; gap: 6px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.02);
      border-bottom: 1px solid var(--card-border);
      scrollbar-width: none;
      position: sticky; top: 64px; z-index: 40;
      backdrop-filter: blur(8px);
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--muted);
      font-size: .82rem; font-weight: 700;
      padding: 8px 18px; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab:hover { background: rgba(0,0,0,0.08); color: var(--text); }
    .tab.active {
      background: rgba(37,99,168,0.15);
      border-color: rgba(37,99,168,0.45);
      color: #1d4ed8;
    }

    /* ── TOPBAR ACTIONS (novo) ── */
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .btn-sm {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.07);
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 9px; color: var(--text);
      font-size: .8rem; font-weight: 700;
      padding: 7px 12px; text-decoration: none; cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-sm:hover { background: rgba(0,0,0,0.12); transform: translateY(-1px); }
    .btn-sm.accent { background: rgba(232,118,42,0.12); border-color: rgba(232,118,42,0.30); color: var(--accent); }

    /* ── MAIN CONTENT ── */
    .ct-main { flex: 1; max-width: 860px; width: 100%; margin: 0 auto; padding: 0 20px 80px; }

    /* ── SUMMARY BAR ── */
    .summary-bar {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 16px 0 10px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .summary-stat { display: flex; align-items: baseline; gap: 6px; }
    .s-val { font-size: 1.1rem; font-weight: 900; color: var(--text); }
    .s-lbl { font-size: .7rem; color: var(--muted); }
    .fonte-badge {
      margin-left: auto;
      font-size: .7rem; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
    }

    /* ── SECTION LABEL (novo) ── */
    .ct-section-label {
      font-size: .68rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1.1px; color: var(--muted);
      margin: 22px 0 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .ct-section-label::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }

    /* ── CARTA CARDS ── */
    .carta-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      margin-bottom: 14px; overflow: hidden;
    }
    .carta-ativo { border-color: rgba(5,150,105,0.30); background: rgba(5,150,105,0.03); }
    .carta-inativo { opacity: .76; }
    .carta-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 22px 12px; gap: 12px; flex-wrap: wrap;
    }
    .carta-left { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .carta-right { display: flex; align-items: flex-end; flex-direction: column; gap: 6px; }
    .carta-nome { font-size: 1rem; font-weight: 900; }
    .versao-badge {
      font-size: .78rem; font-weight: 800; color: #1d4ed8;
      background: rgba(37,99,168,0.12); border: 1px solid rgba(37,99,168,0.22);
      border-radius: 8px; padding: 3px 10px; white-space: nowrap;
    }
    .date-badge {
      font-size: .68rem; font-weight: 700; color: var(--muted);
      background: rgba(0,0,0,0.04); border: 1px solid var(--card-border);
      border-radius: 999px; padding: 3px 10px; white-space: nowrap;
    }
    .carta-kpis { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 22px 18px; align-items: center; }
    .kv-chip-custo { border-color: rgba(232,118,42,0.30) !important; background: rgba(232,118,42,0.08) !important; }
    .kv-chip-custo strong { color: var(--accent) !important; }

    /* ── DELTA BADGE ── */
    .delta-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: .72rem; font-weight: 800; }
    .delta-up { background: rgba(220,38,38,0.10); color: #dc2626; border: 1px solid rgba(220,38,38,0.25); }
    .delta-dn { background: rgba(5,150,105,0.10); color: #059669; border: 1px solid rgba(5,150,105,0.25); }
    .delta-eq { background: rgba(0,0,0,0.05); color: var(--muted); border: 1px solid var(--card-border); }

    /* ── COST BAR ── */
    .cost-bar-wrap { padding: 0 22px 18px; }
    .cost-bar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.06); }
    .cb-lig { background: var(--c-lig); }
    .cb-agr { background: var(--c-agr); }
    .cb-qui { background: var(--c-qui); }
    .cost-bar-legend { display: flex; gap: 14px; margin-top: 5px; }
    .cost-bar-legend span { font-size: .65rem; color: var(--muted); }
    .cbl-lig::before { content: '■ '; color: var(--c-lig); }
    .cbl-agr::before { content: '■ '; color: var(--c-agr); }
    .cbl-qui::before { content: '■ '; color: var(--c-qui); }

    /* ── HISTORY DETAILS ── */
    .hist-details { border-top: 1px solid var(--card-border); }
    .hist-details summary {
      padding: 10px 16px;
      font-size: .75rem; font-weight: 700; color: var(--muted);
      cursor: pointer; list-style: none; user-select: none;
      transition: color .15s;
    }
    .hist-details summary:hover { color: var(--text); }
    .hist-details summary::-webkit-details-marker { display: none; }
    .hist-details[open] summary { color: #1d4ed8; }
    .hist-table { width: 100%; border-collapse: collapse; font-size: .72rem; }
    .hist-table th {
      background: rgba(0,0,0,0.05); color: var(--muted);
      font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 7px 10px; text-align: left; white-space: nowrap;
    }
    .hist-table td { padding: 7px 10px; border-top: 1px solid rgba(0,0,0,0.07); color: var(--text); white-space: nowrap; }
    .row-atual td { background: rgba(37,99,168,0.06); }

    .materials-block,
    .compare-change-block {
      border-top: 1px solid var(--card-border);
      padding: 14px 22px 18px;
    }
    .materials-title,
    .compare-change-title {
      font-size: .72rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }
    .change-list {
      display: grid;
      gap: 8px;
    }
    .change-item {
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: .76rem;
      line-height: 1.5;
      color: var(--text);
    }
    .change-item strong { color: #1d4ed8; }
    .change-item .change-old { color: var(--muted); }
    .change-item .change-new { color: var(--text); font-weight: 700; }
    .change-empty {
      font-size: .76rem;
      color: var(--muted);
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    /* ── INACTIVE SECTION ── */
    details.inactive-section { margin-top: 24px; }
    details.inactive-section > summary {
      display: flex; align-items: center; gap: 8px;
      font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); cursor: pointer; list-style: none; user-select: none;
      padding: 8px 0; transition: color .15s;
    }
    details.inactive-section > summary:hover { color: var(--text); }
    details.inactive-section > summary::-webkit-details-marker { display: none; }
    details.inactive-section > summary::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }
    .inactive-list { margin-top: 8px; }

    /* ── SPINNER ── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; color: var(--muted); gap: 12px; font-size: .85rem; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(0,0,0,0.10); border-top-color: #2563a8; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 2.6rem; margin-bottom: 14px; }
    .empty-state h3 { font-size: 1rem; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: .82rem; line-height: 1.55; max-width: 380px; margin: 0 auto; }
    .btn-action {
      display: inline-block; margin-top: 16px;
      background: rgba(232,118,42,0.15); color: var(--accent);
      border: 1px solid rgba(232,118,42,0.35);
      border-radius: 10px; padding: 8px 20px;
      font-size: .82rem; font-weight: 700; text-decoration: none;
    }
    .btn-action:hover { background: rgba(232,118,42,0.25); }

    /* ── FOOTER ── */
    .ct-footer { text-align: center; font-size: .65rem; color: var(--muted); opacity: .4; padding: 16px 20px 32px; }
  </style>
</head>

<div class="ct-footer">CONCRETRACK © 2026 — Cartas Traço Concrefer</div>



<script>
// ═══════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════
const DOSAGEM_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwJ5R1YMjjutvTDuEnmr2TWKjaf1cJIs6xyj3G-82eBEeKtSgmdrV-R2hYzyO9gum1Qiw/exec';

const UNIDADES = {
  campinas:    { name: 'Campinas',       sub: 'Unidade Campinas — SP' },
  ribeirao:    { name: 'Ribeirão Preto', sub: 'Unidade Ribeirão Preto — SP' },
  pederneiras: { name: 'Pederneiras',    sub: 'Unidade Pederneiras — SP' },
  noroeste:    { name: 'Noroeste',       sub: 'Unidade Noroeste — SP' },
};

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function fmt(n, d = 1) {
  const v = Number(n);
  return isFinite(v) && v !== 0
    ? v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d })
    : (v === 0 ? '0' : '—');
}
function fmtR(n) { return 'R$\u00a0' + fmt(n, 2); }
function fmtDelta(n, d = 2, suffix = '') {
  const v = Number(n);
  if (!isFinite(v)) return '—';
  const sign = v > 0 ? '+' : '';
  return sign + fmt(v, d) + suffix;
}
function fmtDateBadge(c) {
  if (c?.dataHora) {
    const raw = String(c.dataHora).trim();
    const brMatch = raw.match(/^(\d{2}\/\d{2}\/\d{4})/);
    if (brMatch) return brMatch[1];
    const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (isoMatch) return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
  }
  if (c?.data) {
    const raw = String(c.data).trim();
    const brMatch = raw.match(/^(\d{2}\/\d{2}\/\d{4})$/);
    if (brMatch) return brMatch[1];
    const isoMatch = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (isoMatch) return `${isoMatch[3]}/${isoMatch[2]}/${isoMatch[1]}`;
    const d = new Date(raw + 'T12:00:00');
    return isNaN(d.getTime()) ? raw : d.toLocaleDateString('pt-BR');
  }
  return '—';
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function isAtivo(c) { return c.ativaAutomacao === true || c.ativaAutomacao === 'SIM'; }

const MATS_LABELS = [
  { key:'cim',  label:'Cimento'          },
  { key:'adic', label:'Adição'           },
  { key:'an',   label:'Areia Natural'    },
  { key:'ai',   label:'Areia Industrial' },
  { key:'b0',   label:'Brita 0'          },
  { key:'b1',   label:'Brita ½'          },
  { key:'agua', label:'Água'             },
  { key:'adit', label:'Aditivo SP'       },
];

function buildMaterialChanges(atual, anterior) {
  if (!anterior) {
    return [{
      type: 'info',
      html: 'Primeira versão cadastrada. Ainda não existe custo anterior para comparação.'
    }];
  }

  const changes = [];
  const custoAtual = Number(atual?.custoTotal) || 0;
  const custoAnterior = Number(anterior?.custoTotal) || 0;
  if (custoAtual > 0 && custoAnterior > 0) {
    const delta = custoAtual - custoAnterior;
    if (delta !== 0) {
      changes.push({
        type: 'delta',
        html: `<strong>Custo / m³:</strong> <span class="change-old">${fmtR(custoAnterior)}</span> → <span class="change-new">${fmtR(custoAtual)}</span> (${fmtDelta(delta, 2)})`
      });
    } else {
      changes.push({
        type: 'same',
        html: `<strong>Custo / m³:</strong> manteve ${fmtR(custoAtual)} em relação à v${String(Number(anterior?.versao) || 1).padStart(2, '0')}.`
      });
    }
  }

  const snapAtual = atual?.mccSnapshot || {};
  const snapAnterior = anterior?.mccSnapshot || {};
  MATS_LABELS.forEach(mat => {
    const qAtual = Number(atual?.[mat.key]) || 0;
    const qAnterior = Number(anterior?.[mat.key]) || 0;
    const nomeAtual = snapAtual[mat.key]?.nome || '—';
    const nomeAnterior = snapAnterior[mat.key]?.nome || '—';
    const fornAtual = snapAtual[mat.key]?.forn || '—';
    const fornAnterior = snapAnterior[mat.key]?.forn || '—';
    const deltaQtd = qAtual - qAnterior;

    if (deltaQtd !== 0) {
      changes.push({
        type: 'delta',
        html: `<strong>${escHtml(mat.label)}:</strong> quantidade <span class="change-old">${fmt(qAnterior,1)} kg/m³</span> → <span class="change-new">${fmt(qAtual,1)} kg/m³</span> (${fmtDelta(deltaQtd, 1, ' kg/m³')})`
      });
    }
    if (nomeAtual !== nomeAnterior) {
      changes.push({
        type: 'swap',
        html: `<strong>${escHtml(mat.label)}:</strong> produto <span class="change-old">${escHtml(nomeAnterior)}</span> → <span class="change-new">${escHtml(nomeAtual)}</span>`
      });
    }
    if (fornAtual !== fornAnterior) {
      changes.push({
        type: 'swap',
        html: `<strong>${escHtml(mat.label)}:</strong> fornecedor <span class="change-old">${escHtml(fornAnterior)}</span> → <span class="change-new">${escHtml(fornAtual)}</span>`
      });
    }
  });

  if (changes.length === 0) {
    changes.push({
      type: 'same',
      html: `Sem alteração de custo, material, produto ou fornecedor em relação à v${String(Number(anterior?.versao) || 1).padStart(2, '0')}.`
    });
  }

  return changes;
}

// ═══════════════════════════════════════════════
// DATA SOURCES
// ═══════════════════════════════════════════════
function getCartasLocal(uid) {
  try {
    return JSON.parse(localStorage.getItem('ct_cartas_traco') || '[]')
      .filter(c => c.unidade === uid);
  } catch { return []; }
}

async function fetchCartasSheets(uid) {
  const url = `${DOSAGEM_WEBAPP_URL}?action=listar_cartas_traco&unidade=${encodeURIComponent(uid)}`;
  const resp = await fetch(url, { method: 'GET' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const j = await resp.json();
  if (!j.ok) throw new Error(j.error || 'Erro API');
  return j.cartas || [];
}

// ═══════════════════════════════════════════════
// LOAD UNIT
// ═══════════════════════════════════════════════
async function carregarUnidade(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));

  const main = document.getElementById('ct-content');
  main.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><p>Buscando cartas traço…</p></div>`;

  let cartas = [], fonte = 'planilha';
  try {
    cartas = await fetchCartasSheets(id);
  } catch (e) {
    fonte = 'erro';
    console.warn('[CartasTraco] Sheets indisponível:', e.message);
  }

  renderDashboard(cartas, fonte, id);
}

// ═══════════════════════════════════════════════
// RENDER DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard(cartas, fonte, uid) {
  const main = document.getElementById('ct-content');

  if (cartas.length === 0) {
    main.innerHTML = renderEmpty(UNIDADES[uid]?.name, fonte === 'erro');
    return;
  }

  // Group by tracoNome, newest version first
  const grupos = {};
  cartas.forEach(c => {
    const k = c.tracoNome || 'Sem nome';
    if (!grupos[k]) grupos[k] = [];
    grupos[k].push(c);
  });
  Object.values(grupos).forEach(g =>
    g.sort((a, b) => (Number(b.versao) || 1) - (Number(a.versao) || 1))
  );

  const nomesAtivos   = [...new Set(cartas.filter(isAtivo).map(c => c.tracoNome || 'Sem nome'))];
  const nomesInativos = Object.keys(grupos).filter(n => !nomesAtivos.includes(n));

  // Summary stats
  const custosAtivos = nomesAtivos
    .map(n => Number(grupos[n]?.[0]?.custoTotal) || 0)
    .filter(x => x > 0);
  const custoMedio = custosAtivos.length > 0
    ? custosAtivos.reduce((a, b) => a + b, 0) / custosAtivos.length : 0;

  // Fonte badge
  const fonteMap = {
    planilha:         { cor: '#4ced9a', icon: '🟢', label: 'Planilha' },
    local:            { cor: '#9ac4f0', icon: '🔵', label: 'Local' },
    'local-fallback': { cor: '#f59e0b', icon: '🟡', label: 'Offline' },
    erro:             { cor: '#f87171', icon: '🔴', label: 'Erro' },
  };
  const fb = fonteMap[fonte] || fonteMap.planilha;

  let html = `<div class="summary-bar">
    <div class="summary-stat">
      <span class="s-val">${nomesAtivos.length}</span>
      <span class="s-lbl">Traços ativos</span>
    </div>
    ${custoMedio > 0 ? `<div class="summary-stat">
      <span class="s-val">${fmtR(custoMedio)}/m³</span>
      <span class="s-lbl">Custo médio</span>
    </div>` : ''}
    <div class="summary-stat">
      <span class="s-val">${cartas.length}</span>
      <span class="s-lbl">Versões total</span>
    </div>
    <div class="fonte-badge" style="border:1px solid ${fb.cor}55;color:${fb.cor};background:${fb.cor}18;">
      ${fb.icon} ${fb.label}
    </div>
  </div>`;

  // Active traços
  if (nomesAtivos.length > 0) {
    html += `<div class="ct-section-label">Ativos na Automação (${nomesAtivos.length})</div>`;
    nomesAtivos.forEach(nome => { html += renderCartaCard(nome, grupos[nome], true); });
  }

  // Inactive section (collapsible)
  if (nomesInativos.length > 0) {
    html += `<details class="inactive-section">
      <summary>Traços Inativos (${nomesInativos.length})</summary>
      <div class="inactive-list">`;
    nomesInativos.forEach(nome => { html += renderCartaCard(nome, grupos[nome], false); });
    html += `</div></details>`;
  }

  main.innerHTML = html;
}

// ═══════════════════════════════════════════════
// RENDER CARTA CARD
// ═══════════════════════════════════════════════
function renderCartaCard(nome, versoes, ativo) {
  if (!versoes || versoes.length === 0) return '';
  const atual    = versoes[0];
  const anterior = versoes[1] || null;
  const hasCusto = Number(atual?.custoTotal) > 0;
  const deltaCusto = (hasCusto && anterior && Number(anterior.custoTotal) > 0)
    ? Number(atual.custoTotal) - Number(anterior.custoTotal) : null;

  const lig = (Number(atual?.cim) || 0) + (Number(atual?.adic) || 0);
  const ac  = lig > 0 ? (Number(atual?.agua) || 0) / lig : 0;

  // Densidades padrão para fallback (g/cm³ = kg/L)
  const _rho = {
    cim:  Number(atual?.rhoCim)  || 3.12,
    adic: Number(atual?.rhoAdic) || 2.70,
    an:   Number(atual?.rhoAn)   || 2.63,
    ai:   Number(atual?.rhoAi)   || 2.66,
    b0:   Number(atual?.rhoB0)   || 2.68,
    b1:   Number(atual?.rhoB1)   || 2.70,
    agua: 1.00,
    adit: Number(atual?.rhoAdit) || 1.10
  };
  const _v = k => (Number(atual?.[k])||0) / _rho[k];
  const _vSolidos = _v('cim') + _v('adic') + _v('an') + _v('ai') + _v('b0') + _v('b1') + _v('agua') + _v('adit');
  const _vAr = (Number(atual?.ar)||0) * 10;
  const _vTotal_calc = _vSolidos + _vAr;
  const _vArg_calc   = _v('cim') + _v('adic') + _v('an') + _v('ai') + _v('agua') + _v('adit');

  const volumeTotal = Number(atual?.volumeTotal) || (_vTotal_calc > 0 ? parseFloat(_vTotal_calc.toFixed(1)) : 0);
  const volArg      = Number(atual?.volArg)      || (_vArg_calc > 0   ? parseFloat(_vArg_calc.toFixed(1))   : 0);

  // Tx. Arg.: usa campo salvo; fallback calcula pela massa total (soma de todos os agregados)
  const _mArg    = (Number(atual?.cim)||0) + (Number(atual?.adic)||0) + (Number(atual?.an)||0) + (Number(atual?.ai)||0) + (Number(atual?.agua)||0) + (Number(atual?.adit)||0);
  const _mTotal  = _mArg + (Number(atual?.b0)||0) + (Number(atual?.b1)||0);
  const teorArgMassa = Number(atual?.teorArgMassa) || (_mTotal > 0 ? _mArg / _mTotal * 100 : 0);
  const dataBadge = fmtDateBadge(atual);

  // Delta badge
  let deltaHtml = '';
  if (deltaCusto !== null) {
    const sign = deltaCusto > 0 ? '+' : '';
    const cls  = deltaCusto > 0 ? 'delta-up' : deltaCusto < 0 ? 'delta-dn' : 'delta-eq';
    deltaHtml  = `<span class="delta-badge ${cls}">${sign}${fmtR(deltaCusto)} vs v${String(Number(anterior.versao) || 1).padStart(2, '0')}</span>`;
  }

  // Cost composition bar
  let barHtml = '';
  if (hasCusto) {
    const total = Number(atual.custoTotal) || 1;
    const pLig  = Math.round((Number(atual.custoLigantes)  || 0) / total * 100);
    const pAgr  = Math.round((Number(atual.custoAgregados) || 0) / total * 100);
    const pQui  = Math.max(100 - pLig - pAgr, 0);
    barHtml = `<div class="cost-bar-wrap">
      <div class="cost-bar">
        <div class="cb-lig" style="width:${pLig}%" title="Ligantes ${pLig}%"></div>
        <div class="cb-agr" style="width:${pAgr}%" title="Agregados ${pAgr}%"></div>
        <div class="cb-qui" style="width:${pQui}%" title="Quím./Água ${pQui}%"></div>
      </div>
      <div class="cost-bar-legend">
        <span class="cbl-lig">Lig. ${pLig}%</span>
        <span class="cbl-agr">Agr. ${pAgr}%</span>
        <span class="cbl-qui">Quí. ${pQui}%</span>
      </div>
    </div>`;
  }

  // Version history table (collapsible)
  let histHtml = '';
  if (versoes.length > 1) {
    histHtml = `<details class="hist-details">
      <summary>📊 Histórico — ${versoes.length} versões</summary>
      <div class="compare-table-wrap">
        <table class="hist-table">
          <thead><tr>
            <th>Versão</th><th>Data</th><th>Custo/m³</th><th>Δ Custo</th>
            <th>FCK</th><th>Flow</th><th>a/c</th><th>% Adit</th><th>Status</th>
          </tr></thead>
          <tbody>`;
    versoes.forEach((c, i) => {
      const ligC = (Number(c.cim) || 0) + (Number(c.adic) || 0);
      const acC  = ligC > 0 ? (Number(c.agua) || 0) / ligC : 0;
      const prev = versoes[i + 1] || null;
      const dC   = (prev && Number(c.custoTotal) > 0 && Number(prev.custoTotal) > 0)
        ? Number(c.custoTotal) - Number(prev.custoTotal) : null;
      const dStr = dC === null ? '—'
        : dC > 0 ? `<span style="color:#dc2626">+${fmtR(dC)}</span>`
        : dC < 0 ? `<span style="color:#059669">${fmtR(dC)}</span>` : '0';
      histHtml += `<tr class="${isAtivo(c) ? 'row-ativo' : ''} ${i === 0 ? 'row-atual' : ''}">
        <td><strong>v${String(Number(c.versao) || 1).padStart(2, '0')}${i === 0 ? ' ★' : ''}</strong></td>
        <td>${c.data || String(c.dataHora || '—').split(' ')[0]}</td>
        <td>${Number(c.custoTotal) > 0 ? fmtR(c.custoTotal) : '—'}</td>
        <td>${dStr}</td>
        <td>${fmt(c.fck, 0)} MPa</td>
        <td>${fmt(c.flow, 0)} mm</td>
        <td>${fmt(acC, 3)}</td>
        <td>${fmt(c.pctAdit, 2)}%</td>
        <td>${isAtivo(c) ? '✅' : '—'}</td>
      </tr>`;
    });
    histHtml += `</tbody></table></div></details>`;
  }

  const snap = atual?.mccSnapshot || {};
  let matsHtml = '';
  if (MATS_LABELS.some(m => Number(atual?.[m.key]) > 0)) {
    const rows = MATS_LABELS
      .filter(m => Number(atual?.[m.key]) > 0)
      .map(m => {
        const nome = snap[m.key]?.nome || '—';
        const forn = snap[m.key]?.forn || '—';
        return `<tr><td>${escHtml(m.label)}</td><td>${fmt(Number(atual[m.key]),1)}</td><td>${escHtml(nome)}</td><td>${escHtml(forn)}</td></tr>`;
      }).join('');
    matsHtml = `<div class="materials-block"><div class="materials-title">📦 Materiais, Quantidades e Fornecedores</div><div class="compare-table-wrap"><table class="hist-table"><thead><tr><th>Material</th><th>kg/m³</th><th>Produto</th><th>Fornecedor</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  const changeItems = buildMaterialChanges(atual, anterior);
  const compareHtml = `<div class="compare-change-block"><div class="compare-change-title">Comparação com o custo anterior</div>${changeItems.length > 0 ? `<div class="change-list">${changeItems.map(item => `<div class="change-item ${item.type === 'same' || item.type === 'info' ? 'change-empty' : ''}">${item.html}</div>`).join('')}</div>` : `<div class="change-empty">Sem base anterior para comparar.</div>`}</div>`;

  return `<div class="carta-card ${ativo ? 'carta-ativo' : 'carta-inativo'}">
    <div class="carta-header">
      <div class="carta-left">
        <span class="carta-nome">${escHtml(nome)}</span>
        ${ativo ? '<span class="badge-ativo">⚙️ ATIVA</span>' : '<span class="badge-inativo">Inativa</span>'}
        ${atual?.nomeAutomacao ? `<span class="badge-automacao">${escHtml(atual.nomeAutomacao)}</span>` : ''}
      </div>
      <div class="carta-right">
        <span class="versao-badge">v${String(Number(atual?.versao) || 1).padStart(2, '0')} ★</span>
        <span class="date-badge">Atualizada em ${escHtml(dataBadge)}</span>
      </div>
    </div>
    <div class="carta-kpis">
      <div class="kv-chip"><span>FCK</span><strong>${fmt(atual?.fck, 0)} MPa</strong></div>
      <div class="kv-chip"><span>Flow</span><strong>${fmt(atual?.flow, 0)} mm</strong></div>
      <div class="kv-chip"><span>a/c</span><strong>${fmt(ac, 3)}</strong></div>
      <div class="kv-chip"><span>Vol. Traço</span><strong>${volumeTotal > 0 ? fmt(volumeTotal, 1) + ' L' : '—'}</strong></div>
      <div class="kv-chip"><span>Tx. Arg.</span><strong>${teorArgMassa > 0 ? fmt(teorArgMassa, 1) + '%' : '—'}</strong></div>
      <div class="kv-chip"><span>Vol. Arg.</span><strong>${volArg > 0 ? fmt(volArg, 1) + ' L' : '—'}</strong></div>
      <div class="kv-chip"><span>Cimento</span><strong>${fmt(atual?.cim, 1)} kg</strong></div>
      <div class="kv-chip"><span>% Adit/Lig</span><strong>${fmt(atual?.pctAdit, 2)}%</strong></div>
      ${hasCusto ? `<div class="kv-chip kv-chip-custo"><span>Custo / m³</span><strong>${fmtR(atual.custoTotal)}</strong></div>` : ''}
      ${deltaHtml}
    </div>
    ${barHtml}
    ${compareHtml}
    ${matsHtml}
    ${histHtml}
  </div>`;
}

// ═══════════════════════════════════════════════
// EMPTY STATE
// ═══════════════════════════════════════════════
function renderEmpty(nome, erro) {
  return `<div class="empty-state">
    <div class="empty-icon">${erro ? '⚠️' : '📋'}</div>
    <h3>${erro ? 'Planilha indisponível' : 'Nenhuma carta em ' + escHtml(nome || '')}</h3>
    <p>${erro
      ? 'Não foi possível conectar à planilha. Dados locais também estão vazios.'
      : 'Salve cartas traço na Calculadora Dosagem, selecione a unidade e marque "Carta Ativa na Automação".'
    }</p>
    <a href="../dosagem-concreto/index.html" class="btn-action">→ Ir para Dosagem</a>
  </div>`;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => carregarUnidade(btn.dataset.id));
});
carregarUnidade('campinas');
</script>

</body>
