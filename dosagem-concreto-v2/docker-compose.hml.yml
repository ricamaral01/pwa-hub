services:
  hub-mock:
    image: python:3.12-slim
    command: python /mock/supabase_mock.py
    volumes:
      - ./deploy/hml/supabase_mock.py:/mock/supabase_mock.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18310/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dosagem_hml
      POSTGRES_PASSWORD: dosagem_hml_local
      POSTGRES_DB: concretrack_dosagem_hml
    volumes:
      - hml_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosagem_hml -d concretrack_dosagem_hml"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.hml
    environment:
      DATABASE_URL: postgresql+psycopg://dosagem_hml:dosagem_hml_local@postgres:5432/concretrack_dosagem_hml
      AMBIENTE: hml
      MODO_PILOTO: "true"
      SUPABASE_URL: http://hub-mock:18310
      SUPABASE_ANON_KEY: local-hml-only
    depends_on:
      postgres:
        condition: service_healthy
      hub-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18300/api/v1/saude', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  nginx:
    build:
      context: .
      dockerfile: deploy/hml/Dockerfile.nginx
    ports:
      - "127.0.0.1:18444:443"
    depends_on:
      api:
        condition: service_healthy
volumes:
  hml_data:
