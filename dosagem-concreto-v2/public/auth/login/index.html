<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Dosagem</title>
<style>body{font:16px system-ui;background:#eef1f7;color:#0a1530;margin:0;min-height:100vh;display:grid;place-items:center}main{background:white;padding:2rem;width:min(90vw,24rem);border-radius:12px;box-shadow:0 10px 30px #0a15301a}label{display:block;margin:1rem 0}input{display:block;width:100%;box-sizing:border-box;padding:.7rem}button{background:#db0a40;color:white;border:0;padding:.8rem 1rem;border-radius:6px;cursor:pointer;width:100%;margin:.5rem 0}.secondary{background:#0a1530}#message{min-height:2.5rem;color:#9f1239}</style>
</head>
<body><main><h1>ConcreTrack Dosagem</h1><p>Entre com a conta do Hub ou com uma conta local</p>
<button id="hub" type="button">Entrar com o Hub</button>
<form id="local"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><label><input id="remember" type="checkbox" style="display:inline;width:auto"> Manter conectado</label><button class="secondary">Entrar com conta local</button></form><p id="message" role="alert"></p></main>
<script src="/auth/pilot-banner.js" defer></script><script>
const message=document.getElementById('message');
const password=document.getElementById('password');
const showPassword=document.createElement('button');
showPassword.type='button';showPassword.className='secondary';showPassword.textContent='Mostrar senha';
showPassword.setAttribute('aria-controls','password');showPassword.setAttribute('aria-pressed','false');
showPassword.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';showPassword.textContent=show?'Ocultar senha':'Mostrar senha';showPassword.setAttribute('aria-pressed',String(show));};
password.closest('label').after(showPassword);
const b64=bytes=>btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('hub').onclick=async()=>{
  try{
    const verifier=b64(crypto.getRandomValues(new Uint8Array(32)));
    const state=b64(crypto.getRandomValues(new Uint8Array(32)));
    const challenge=b64(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier))));
    sessionStorage.setItem('dosagem-pkce-verifier',verifier);
    sessionStorage.setItem('dosagem-pkce-state',state);
    sessionStorage.setItem('dosagem-manter',document.getElementById('remember').checked?'1':'0');
    const response=await fetch('/api/v1/auth/hub/iniciar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({estado:state,code_challenge:challenge})});
    if(!response.ok)throw Error('Não foi possível iniciar o acesso pelo Hub.');
    location.assign((await response.json()).url);
  }catch(error){message.textContent=error.message;}
};
document.getElementById('local').onsubmit=async event=>{
  event.preventDefault();
  try{
    const response=await fetch('/api/v1/auth/local/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,senha:document.getElementById('password').value,manter_conectado:document.getElementById('remember').checked})});
    if(!response.ok){
      const result=await response.json().catch(()=>null);
      const code=result?.erro?.codigo||result?.codigo||'SEM_CODIGO';
      throw Error(`Acesso recusado (HTTP ${response.status}, ${code}). Confira o e-mail e a senha; se estiverem corretos, informe este código ao suporte.`);
    }
    const body=await response.json();
    location.replace(body.trocarSenha?'/auth/trocar-senha/':(sessionStorage.getItem('dosagem-retorno')||'/'));
  }catch(error){message.textContent=error.message;}
};
</script></body></html>
