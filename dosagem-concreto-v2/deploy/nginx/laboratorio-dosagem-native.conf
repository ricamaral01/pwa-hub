    location ^~ /unificado/laboratorio/dosagem/native/ {
        error_page 401 = @laboratorio_login;
        error_page 403 = @laboratorio_sem_acesso;
        auth_request /unificado/laboratorio-auth;
        alias /opt/concrefer-unificado/dosagem-native/static/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=300" always;
    }

    location ^~ /unificado/laboratorio/dosagem/api/ {
        error_page 401 = @laboratorio_login;
        error_page 403 = @laboratorio_sem_acesso;
        auth_request /unificado/laboratorio-auth;
        auth_request_set $lab_assertion $upstream_http_x_lab_assertion;
        proxy_pass http://127.0.0.1:13067/native/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Lab-Assertion $lab_assertion;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
