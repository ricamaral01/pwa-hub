server {
    listen 80;
    server_name dosagem.concretrack.com.br;
    root /opt/concretrack-dosagem/acme;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dosagem.concretrack.com.br;
    ssl_certificate /etc/letsencrypt/live/dosagem.concretrack.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosagem.concretrack.com.br/privkey.pem;
    root /opt/concretrack-dosagem/current/web;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ {
        proxy_pass http://127.0.0.1:18300;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

server {
    listen 127.0.0.1:18380;
